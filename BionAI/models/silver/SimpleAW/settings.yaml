model_name: SimpleAW
settings:
  source:
    cloud_provider: azure
    source_type: file
    use_unity_catalog_volumes: true
    volume_name: AdventureworksFolderBased2
    source_catalog: bronze
    source_database: raw
    storage_account: ''
    container: ''
    folder_path: ''
    s3_bucket: ''
    s3_folder_path: ''
    source_secret_scope: ''
    use_path_template: false
    path_template: ''
    file_type: parquet
    file_extension: .parquet
    file_pattern: <tablename>.parquet
    file_pattern_is_regex: false
    folder_traversal_depth: 1
    per_table_subfolder: false
    source_force_string_types: false
    source_sanitize_column_names: false
    source_most_recent_file_only: false
    source_most_recent_file_per_name: false
    use_iso_dated_folders: true
    iso_date_folder_format: yyyyMMddHHmm
    iso_folder_name_as_effective_date: false
    csv_delimiter: ','
    csv_quote_char: '"'
    csv_quote_escape_char: \
    csv_has_header: true
    csv_rows_to_skip: 0
    json_multiline: false
    json_auto_expand: false
    json_level_delimiter: _
    use_auto_loader: false
    use_high_watermark: true
    high_watermark_file_level: true
    process_one_file_per_run: false
    loop_until_no_files_left: false
    max_loop_iterations: 100
    overwrite_processed_files: false
    max_folders_per_run: 0
    iso_folder_initial_load: all
  destination:
    zone: silver
    auto_schema_enabled: false
    view_only_option_enabled: false
    managed_tables: true
    target_database: yasilvermodel
    dest_catalog: silver
    dest_catalog_add_path: false
    dest_catalog_path: ''
    dest_catalog_path_scope_key: ''
    dest_catalog_suppress_create: false
    dest_database_suppress_create: false
    dest_cloud_provider: azure
    dest_storage_account: ''
    dest_container: ''
    dest_folder_path: ''
    dest_subfolder: ''
    dest_s3_bucket: ''
    dest_s3_folder_path: ''
    use_dest_path_template: false
    dest_path_template: ''
    dest_secret_scope: ''
    create_auto_view: false
    add_primary_key_constraints: false
  processing:
    beginning_cells_enabled: false
    pre_query_cells_enabled: false
    end_cells_enabled: false
    surrogate_keys_enabled: false
    passthrough_surrogate_keys: false
    hash_function: UNHEX(SHA2(<stringvalue>, 256))
    hash_multi_value_delimiter: '|'
    int_surrogate_keys_enabled: true
    int_key_hash_function: xxhash64(<stringvalue>)
    hash_int_conversion_function: ''
    int_key_identifier: _Id
    foreign_table_ss_key_prefix: ''
    silver_audit_hwm_column_enabled: false
    silver_audit_hwm_column_name: ''
    silver_to_gold_audit_hwm_column_name: ''
    expectations_enabled: false
    explicit_casting_enabled: false
    effective_dates_enabled: false
    effective_dates_round_to_midnight: false
    effective_dates_from_iso_folder: false
    effective_dates_merge_source: false
    not_in_source_deletes_enabled: false
    custom_delete_query: false
    hard_deletes: true
    table_statistics_enabled: true
    streaming_enabled: false
    streaming_cdc_delete_expression: ''
    streaming_include_delete_expression: false
    streaming_persist_source: false
    streaming_sequence_column: ''
    streaming_source_variable: ''
    streaming_use_cdf_source: false
    dlt_quarantine_enabled: false
    alternate_keys_enabled: false
    alt_keys_remove_resolved: false
    alt_keys_remove_with_flag: false
    change_hash_enabled: false
    include_create_statements: true
    vacuum_enabled: false
    vacuum_retention_hours: 168
    optimize_enabled: true
    schema_updates_enabled: true
    infer_missing_records_enabled: false
    pre_run_notebook_path: ''
    post_run_notebook_path: ''
    notebook_name_prefix: ''
    table_name_prefix: ''
    max_notebook_retries: 0
    parallel_notebook_workers: 4
    notebook_run_timeout: 3600
    truncate_and_load: false
    dedup_source_enabled: false
    dedup_source_recency_column: ''
    ansi_mode: false
    delta_auto_optimize_write: false
    delta_format_check_suppressed: false
    change_data_feed_enabled: false
    use_legacy_schema_evolution: false
    enable_schema_updates_with_column_ids: false
    global_string_null_replace_enabled: false
    global_string_null_replace_function: COALESCE(<value>, '')
    global_null_key_replacement_function: IFNULL(<value>, 'NULL')
    use_variables_for_db_and_table_names: false
    allow_optional_python_promotion: false
    apply_expressions_first: false
    add_grave_accent: false
    check_for_user_section_updates: false
    merge_on_surrogate_key: null
    include_debug_cells: false
    delete_table_data_in_debug_mode: false
    settings_dump_enabled: false
    workflow_capture_job_ids: false
    add_batch_notebooks: false
    metadata_json_files_enabled: true
  deployment:
    artifact_type: notebook
    artifact_layout: parameterized
    dlt_layout: consolidated
    dlt_import_style: lakeflow
    bundle_enabled: false
    local_deployment_enabled: true
    local_process_path: BionAI/notebooks/silver/SimpleAW/tables
    local_dependency_path: BionAI/notebooks/silver/SimpleAW/common
    api_deployment_enabled: false
    databricks_workspace_url: ''
    remote_process_path: ''
    remote_dependency_path: ''
    pipeline_name: ''
    pipeline_trigger_on_deploy: false
    pipeline_full_refresh: false
    bundle_cluster_policy_id: ''
