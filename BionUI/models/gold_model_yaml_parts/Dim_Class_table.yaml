- Name: GoldTableQuery
  Value: |
    SELECT  
    --COALESCE(CAST(Class_Contract_Key AS STRING), '-1') AS Class_Key
    COALESCE(CAST(ClassId AS STRING), '-1') AS Class_Key
    ,ClassId
    ,SystemUniqueKey
    ,ContractId
    ,ContractSemester
    ,ClassName
    ,Estimated_Start_Date
    ,Estimated_Student_Start_Date
    ,ClassSemester
