    ,OnCreditMemo
    ,Is_Schedulable as IsSchedulable
    ,IsPAYG
    ,Modality
    ,Location_Key
    ,ClassSecondaryName
    ,IsBudgeted
    ,BudgetedDate
    ,IsDeleted_DataLake
    ,CreatedDate
    ,CreatedById
    ,LastModifiedDate
