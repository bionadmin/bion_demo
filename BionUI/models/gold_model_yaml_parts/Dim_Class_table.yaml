    ,Audit_ModifiedDateTime   
    ,SourceSystem_Key
    ,ContractNumber_Key
    ,ContractNumber
    ,OpportunityId
    ,ContractStage
    ,EnrollmentYear
    ,Product_Key
    ,ProductId
    ,ProductCode
    ,Semester
    ,Student_Key
    ,StudentId
    ,current_timestamp() AS RIGHTNOW

    FROM  IDENTIFIER(var_destination_catalog_name||".`02_silver_tier_2`.fusion_class")

    WHERE  (Audit_ModifiedDateTime>CAST(var_max_audit_time AS TIMESTAMP))
