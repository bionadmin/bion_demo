- Name: GoldTableQuery
  Value: |-
    SELECT
       CSS.Id AS Dim_Course_Section_StudentId
      ,CSS.Class_Status_picklist__c AS Class_Status_picklist
      ,CSS.Completed_Date__c AS Completed_Date
      ,CSS.Contracted_School__c AS Contracted_School
      ,CSS.Course_Attendance__c AS Course_Attendance
      ,CSS.Course_Completion_Email_Sent__c AS Course_Completion_Email_Sent
      ,CSS.Course_Division__c AS Course_Division
      ,CSS.Course_Section__c AS Course_Section
      ,CSS.Course_Section_Name__c AS Course_Section_Name
      ,CASE WHEN CSS.Course_Survey_Completed__c IS NULL THEN FALSE ELSE TRUE END AS Course_Survey_Completed
      ,CASE WHEN CSS.Course_Survey_Sent__c IS NULL THEN FALSE ELSE TRUE END AS Course_Survey_Sent
      ,CSS.First_Scheduled_Session_Date__c AS First_Scheduled_Session_Date
      ,CSS.First_Session_Reservation_Instance_Key__c AS First_Session_Reservation_Instance_Key
      ,CSS.Last_Scheduled_Session_Date__c AS Last_Scheduled_Session_Date
      ,CSS.Primary_Teacher__c AS Primary_Teacher
      ,CSS.Primary_Teacher_Name__c AS Primary_Teacher_Name
      ,CSS.Student__c AS Student
      ,CSS.Student_Id__c AS Student_Id
      ,CSS.Student_Last_Name__c AS Student_Last_Name
      ,CSS.Student_School_Id__c AS Student_School_Id
      ,CSS.SystemModstamp
      ,CSS.Teacher_Closed_Date__c AS Teacher_Closed_Date
      ,CSS.Teacher_Course_Closed_By__c AS Teacher_Course_Closed_By
      ,CSS.Is_Completed__c AS Is_Completed
      ,CSS.Is_Historical__c AS Is_Historical
      ,CASE WHEN CSS.IsDeleted_DataLake = TRUE 
                 OR P2.IsDeleted_DataLake = TRUE 
                 THEN TRUE ELSE FALSE END AS IsDeleted_DataLake --6/5/26 Updated per US21436
      ,CASE WHEN P2.Id IS NULL THEN FALSE ELSE TRUE END AS Has_Product --6/5/26 Added per US21436
      ,COALESCE(P2.IsActive, FALSE) AS Product_IsActiveInSalesforce --6/5/26 Added per US21436
      ,COALESCE(P2.Exclude_From_Transcript__c, TRUE) AS Exclude_Transcript --6/5/26 Added per US21436
      ,CSS.CreatedDate
      ,CSS.CreatedById
      ,CSS.LastModifiedDate
      ,CSS.LastModifiedById
      ,CSS.Audit_ModifiedDateTime  
      ,current_timestamp() AS RIGHTNOW
          FROM IDENTIFIER(var_destination_catalog_name||'.02_silver_tier_1_salesforce.Course_Section_Student__c_vw') CSS
            LEFT JOIN IDENTIFIER(var_destination_catalog_name||'.02_silver_tier_1_salesforce.Course_Section__c_vw') CS
         ON CSS.Course_Section__c = CS.id
         LEFT JOIN IDENTIFIER(var_destination_catalog_name||'.02_silver_tier_1_salesforce.Course__c_vw')C
         ON C.Id = CS.Course__c
         LEFT JOIN IDENTIFIER(var_destination_catalog_name||'.02_silver_tier_1_salesforce.Product2_vw') P2
         ON C.Product__c = P2.Id

          WHERE (CSS.Audit_ModifiedDateTime>CAST(var_max_audit_time AS TIMESTAMP)
                OR CS.Audit_ModifiedDateTime>CAST(var_max_audit_time AS TIMESTAMP)
                OR C.Audit_ModifiedDateTime>CAST(var_max_audit_time AS TIMESTAMP)
                OR P2.Audit_ModifiedDateTime>CAST(var_max_audit_time AS TIMESTAMP)
                )
        --AND P2.IsActive = false --6/5/26 Commented out per US21436
        --AND P2.IsDeleted_DataLake = false --6/5/26 Commented out per US21436
        --AND P2.Exclude_From_Transcript__c = false --6/5/26 Commented out per US21436
  Type: Text
- Name: InferMissingRecords
  Value: |-
    True
  Type: Boolean
- Name: UseHashKeys
  Value: |-
    True
  Type: Boolean
