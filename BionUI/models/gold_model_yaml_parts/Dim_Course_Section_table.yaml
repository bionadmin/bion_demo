     ,CS.Grade_Weights__c AS Grade_Weights
     ,CS.Historical_Department__c AS Historical_Department
     ,CS.Is_Historical__c AS Is_Historical
     ,CS.IsDeleted_DataLake
     ,P2.Exclude_From_Transcript__c AS Exclude_Transcript
     ,CS.Last_Scheduled_Session_Date__c AS Last_Scheduled_Session_Date
     ,CS.LastReferencedDate
     ,CS.LastViewedDate
     ,CS.LMS_Course_Concluded__c AS LMS_Course_Concluded
     ,CS.LMS_Course_Id__c AS LMS_Course_Id
     ,CS.LMS_Course_Section_ID__c AS LMS_Course_Section_ID
