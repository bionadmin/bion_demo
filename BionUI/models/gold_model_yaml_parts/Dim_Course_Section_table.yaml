     ,CS.Ready_For_Teacher_Closeout__c AS Ready_For_Teacher_Closeout
     ,CS.RecordTypeId
     ,CS.Required_Number_of_Sessions__c AS Required_Number_of_Sessions
     ,CS.Savvas_Class_ID__c AS Savvas_Class_ID
     ,CS.School__c AS School
     ,CS.School_Taken_At__c AS School_Taken_At
     ,CS.Secondary_Name__c AS Secondary_Name
     ,CS.Semester__c AS Semester
     ,CS.Start_Date__c AS Start_Date
     ,CS.Students_In_Course__c AS Students_In_Course
     ,CS.SystemModstamp
     ,CS.Teacher_Closed_Date__c AS Teacher_Closed_Date
     ,CS.Teacher_Course_Closed_By__c AS Teacher_Course_Closed_By
     ,CS.Teacher_Email_For_Lookup__c AS Teacher_Email_For_Lookup
     ,CS.Transcript_Type__c AS Transcript_Type
     ,CS.Unconclude_Canvas_Enrollments__c AS Unconclude_Canvas_Enrollments
     ,CS.CreatedDate
     ,CS.CreatedById
     ,CS.LastModifiedDate
     ,CS.LastModifiedById
     ,CS.Audit_ModifiedDateTime   
     ,current_timestamp() AS RIGHTNOW--leave this.
        FROM IDENTIFIER(var_destination_catalog_name||'.02_silver_tier_1_salesforce.Course_Section__c_vw') CS
         LEFT JOIN IDENTIFIER(var_destination_catalog_name||'.02_silver_tier_1_salesforce.Course__c_vw') C
         ON C.Id = CS.Course__c
         LEFT JOIN IDENTIFIER(var_destination_catalog_name||'.02_silver_tier_1_salesforce.Product2_vw') P2
         ON C.Product__c = P2.Id

        WHERE (CS.Audit_ModifiedDateTime>CAST(var_max_audit_time AS TIMESTAMP)
              OR C.Audit_ModifiedDateTime>CAST(var_max_audit_time AS TIMESTAMP)
              OR P2.Audit_ModifiedDateTime>CAST(var_max_audit_time AS TIMESTAMP)
              )
