     ,CS.Name
     ,CS.Name__c AS Name2
     ,CS.Name_From_Course__c AS Name_From_Course
     ,CS.OwnerId
     ,CS.Pearson_EasyBridge_Checklist__c AS Pearson_EasyBridge_Checklist
     ,CS.Pearson_Id__c AS Pearson_Id
     ,CS.Pearson_Product_Ids__c AS Pearson_Product_Ids
     ,CS.Pearson_Status__c AS Pearson_Status
