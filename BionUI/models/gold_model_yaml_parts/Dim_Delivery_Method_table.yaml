- Name: GoldTableQuery
  Value: |-
    ,
    Matrix_Delivery_Method AS (
        SELECT
            DeliveryMethod_Key as DeliveryMethodId,
            DeliveryMethod_Key as Matrix_DeliveryMethod_Key,
            DisplayName,
            Value as DeliveryMethod,
            IsDefault,
            IsActive,
            6 as SourceSystem_Key, 
            Created as CreatedDate,
            CreatedBy as CreatedById,
            LastUpdated as LastModifiedDate,
            UpdatedBy as LastModifiedById,
            IsDeleted_Datalake,
            Audit_ModifiedDateTime,   
            current_timestamp() AS RIGHTNOW
        FROM
            IDENTIFIER(var_destination_catalog_name||'.02_silver_tier_1_matrix.deliverymethod_vw')
            WHERE (
            Audit_ModifiedDateTime>CAST(var_max_audit_time AS TIMESTAMP)
            )
    ),
    Null_Delivery_Method AS (
        SELECT
            4 as DeliveryMethodId,
            0 as Matrix_DeliveryMethod_Key,
            null as DisplayName,
            'Just NULL Value' as DeliveryMethod,
            null as IsDefault,
            null as IsActive,
            6 as SourceSystem_Key, 
            null as CreatedDate,
            null as CreatedById,
            null as LastModifiedDate,
            null as LastModifiedById,
            null as IsDeleted_Datalake,
            current_timestamp() AS Audit_ModifiedDateTime,
            current_timestamp() AS RIGHTNOW
    )
    SELECT 
            cast(DeliveryMethodid as string) as DeliveryMethodid,
            cast (Matrix_DeliveryMethod_Key as string) as Matrix_DeliveryMethod_Key,
            DisplayName,
            DeliveryMethod,
            IsDefault,
            IsActive,
            SourceSystem_Key, 
            CreatedDate,
            CreatedById,
            LastModifiedDate,
            LastModifiedById,
            IsDeleted_Datalake,
            Audit_ModifiedDateTime,
            RIGHTNOW 
    FROM Matrix_Delivery_Method
    UNION ALL
    SELECT 
            cast(DeliveryMethodid as string) as DeliveryMethodid,
            cast (Matrix_DeliveryMethod_Key as string) as Matrix_DeliveryMethod_Key,
            DisplayName,
            DeliveryMethod,
            IsDefault,
            IsActive,
            SourceSystem_Key, 
            CreatedDate,
            CreatedById,
            LastModifiedDate,
            LastModifiedById,
            IsDeleted_Datalake,
            Audit_ModifiedDateTime,
            RIGHTNOW 
    FROM Null_Delivery_Method
