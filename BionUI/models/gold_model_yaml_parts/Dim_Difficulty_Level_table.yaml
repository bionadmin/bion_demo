- Name: GoldTableQuery
  Value: |
    SELECT 
        case 
            when lower(Curriculum_Level__c) = 'college prep' then 1
            when lower(Curriculum_Level__c) = 'essential' then 2
            when lower(Curriculum_Level__c) = 'honors' then 3
            when lower(Curriculum_Level__c) = 'middle school' then 4
            when lower(Curriculum_Level__c) = 'middle school essential' then 5
            when lower(Curriculum_Level__c) = 'n/a' then 6
            when lower(Curriculum_Level__c) = 'none' then 7
            when lower(Curriculum_Level__c) = 'one level' then 8
            when lower(Curriculum_Level__c) = 'standard' then 9
            when lower(Curriculum_Level__c) = 'university' then 10
            when lower(Curriculum_Level__c) = 'ap' then 27
            when lower(Curriculum_Level__c) = 'college prep standard' then 28
            when lower(Curriculum_Level__c) = 'general' then 30
            when lower(Curriculum_Level__c) = 'instruction boost' then 31
            when lower(Curriculum_Level__c) = 'package tutoring' then 32
            when lower(Curriculum_Level__c) = 'tutoring' then 33
            when lower(Curriculum_Level__c) = 'workshop' then 34
            else 0 end as DifficultyLevelId,
        Curriculum_Level__c AS DisplayName,
        Curriculum_Level__c as Value,
        Curriculum_Level__c as Description,
        '1' AS SourceSystem_Key,
        null AS SessionType,
        first(CreatedDate) as CreatedDate,
        first(CreatedById) as CreatedById,
        first(LastModifiedDate) as LastModifiedDate,
        first(LastModifiedById) as LastModifiedById,
        false AS IsDeleted_Datalake,
        first(Audit_ModifiedDateTime) as Audit_ModifiedDateTime,
        current_timestamp() AS RIGHTNOW--leave this.
    FROM IDENTIFIER(var_destination_catalog_name||'.02_silver_tier_1_salesforce.opportunitylineitem_vw') WHERE Curriculum_Level__c is not null
        AND Audit_ModifiedDateTime>CAST(var_max_audit_time AS TIMESTAMP)
    group by Curriculum_Level__c, IsDeleted
    UNION
    SELECT
        '-1' as DifficultyLevelId,
        null AS DisplayName,
        null as Value,
        'Unknown' as Description,
        null AS SourceSystem_Key,
        '-1' AS SessionType,
        null as CreatedDate,
        null as CreatedById,
        null as LastModifiedDate,
        null as LastModifiedById,
        false AS IsDeleted_Datalake,
        current_timestamp() as Audit_ModifiedDateTime,
        current_timestamp() AS RIGHTNOW--leave this.
    UNION
    SELECT
        '29' as DifficultyLevelId,
        'College Prep Accelerated' AS DisplayName,
        'College Prep Accelerated' as Value,
        'College Prep Accelerated' as Description,
        '1' AS SourceSystem_Key,
        null AS SessionType,
        null as CreatedDate,
        null as CreatedById,
        null as LastModifiedDate,
        null as LastModifiedById,
        false AS IsDeleted_Datalake,
        current_timestamp() as Audit_ModifiedDateTime,
        current_timestamp() AS RIGHTNOW--leave this.
  Type: Text
