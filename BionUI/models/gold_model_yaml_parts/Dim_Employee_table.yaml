- Name: GoldTableQuery
  Value: |-
    SELECT
            fe.EmployeeUnique_Key
           ,fe.EmployeeUniqueId
           ,fe.Employee_Key
           ,fe.EmployeeId
           ,fe.EmployeeNbr
           ,fe.LocationId
           ,fe.Location_KeyInt
           ,fe.UserName
           ,fe.FirstName
           ,fe.LastName
           ,fe.FullName
           ,fe.Matrix_EmployeeLastName
           ,fe.Department
           ,fe.Email
           ,fe.PhoneNumber
           ,fe.PrimaryLocation
           ,fe.ManagerName
           ,fe.ManagerEmployeeId
           ,fe.ManagerLocation
           ,fe.SalesforceId
           ,fe.Matrix_User_Key
           ,fe.StartDate
           ,fe.PrimaryTitle
           ,fe.PayrollAddress_Key
          ,concat(fe.Address1, "", fe.Address2) AS Address
          ,fe.City
          ,fe.State
          ,fe.PostalCode
          ,fe.IANAName
           ,fe.IsActive
          ,fu.User_Key as fusionu_user_key
          ,fu.user_id as fusionu_user_id
          ,fu.last_user_session_date as fusionu_last_user_session_date
          ,fe.IsDeleted_Datalake
           ,fe.Division_Key
           ,fe.CreatedDate
           ,fe.CreatedById
           ,fe.ModifiedDate
           ,fe.ModifiedById
           ,fe.Audit_ModifiedDateTime
           ,current_timestamp() AS RIGHTNOW
    ,fe.TeacherType
    ,fe.Email_2
    ,fe.Campus
    ,fe.Campus_Director
    ,fe.LastActivityDate
    ,fe.RecordTypeName
    ,fe.SourceSystem_Key
    ,fe.CurrentEmployeeName
    ,fe.SFUserId
    FROM IDENTIFIER(var_destination_catalog_name||'.02_silver_tier_2.Fusion_Employee') fe
          LEFT JOIN IDENTIFIER(var_destination_catalog_name||'.`02_silver_tier_2`.fusionu_users') fu ON fe.EmployeeNbr = fu.EmployeeNbr

           WHERE fe.Audit_ModifiedDateTime>CAST(var_max_audit_time AS TIMESTAMP)
                 OR fu.Audit_ModifiedDateTime>CAST(var_max_audit_time AS TIMESTAMP)
  Type: Text
- Name: InferMissingRecords
  Value: |-
    True
  Type: Boolean
- Name: UseHashKeys
  Value: |-
    True
  Type: Boolean
