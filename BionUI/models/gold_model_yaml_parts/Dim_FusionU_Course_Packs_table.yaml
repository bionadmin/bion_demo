- Name: GoldTableQuery
  Value: |-
    SELECT DISTINCT
      cp['course_pack_id'] AS course_pack_key
      ,cp['course_pack_id'] AS course_pack_id
      ,cp['course_pack_name'] AS course_pack_name
      ,c.Curriculum_Key
      ,c.curriculum_id
      ,coalesce(utc.course_pack_is_locked, false) AS is_locked
      ,c.Created AS CreatedDate
      ,c.CreatedBy AS CreatedById
      ,c.LastUpdated AS ModifiedDate
      ,c.UpdatedBy AS ModifiedById
      ,CASE WHEN c.IsDeleted_Datalake = TRUE OR utc.course_pack_is_locked = TRUE THEN TRUE ELSE FALSE END AS IsDeleted_Datalake
      ,COALESCE(c.LastUpdated, c.Created) AS Audit_ModifiedDateTime
      ,current_timestamp() AS RIGHTNOW

    FROM IDENTIFIER(var_destination_catalog_name||'.`02_silver_tier_1_fusionu`.curriculums_vw') c
    LEFT JOIN IDENTIFIER(var_destination_catalog_name||'.`02_silver_tier_2`.fusionu_user_transcript_courses') utc on c.Curriculum_Key = utc.curriculum_id

    LATERAL VIEW EXPLODE(course_packs) AS cp

    WHERE course_packs IS NOT NULL 
          AND c.Audit_RowIsCurrent = true
          AND (COALESCE(c.LastUpdated, c.Created)>=CAST(var_max_audit_time AS TIMESTAMP)
              OR utc.Audit_ModifiedDateTime>=CAST(var_max_audit_time AS TIMESTAMP)
            )
  Type: Text
