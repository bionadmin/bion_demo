- Name: GoldTableQuery
  Value: |-
    SELECT
      Course_Key
      ,course_id
      ,course_code
      ,title as course_name
      ,active
      ,allow_reviews
      ,course_type
      ,current_revision
      ,description
      ,due_type
      ,email_learners
      ,is_ilt
      ,is_mobile
      ,number_of_reviews
      ,publish_date
      ,last_upload_date
      ,additional_details
      ,duration_mins
      ,average_rating
      ,due_span_days
      ,compliance_days
      ,compliance_retake_days
      ,due_date
      ,Created as CreatedDate
      ,CreatedBy as CreatedById
      ,CASE WHEN LastUpdated < Created OR LastUpdated IS NULL THEN Created ELSE LastUpdated END AS ModifiedDate
      ,UpdatedBy as ModifiedById
      ,CASE WHEN LastUpdated < Created OR LastUpdated IS NULL THEN Created ELSE LastUpdated END AS Audit_ModifiedDateTime
      ,IsDeleted_Datalake
      ,RevisionHash
      ,current_timestamp() as RIGHTNOW

    FROM 
    IDENTIFIER(var_destination_catalog_name||'.`02_silver_tier_1_fusionu`.courses_vw')

    WHERE Audit_RowIsCurrent = true 
          AND IsDeleted_Datalake = false
          AND (COALESCE(LastUpdated, Created)>CAST(var_max_audit_time AS TIMESTAMP)
               OR Created>CAST(var_max_audit_time AS TIMESTAMP))
  Type: Text
