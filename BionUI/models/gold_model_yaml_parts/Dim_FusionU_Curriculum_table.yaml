- Name: GoldTableQuery
  Value: |-
    , CourseCount AS (
      SELECT
           curriculum_id
           ,MAX(Audit_ModifiedDateTime) AS Audit_ModifiedDateTime
           ,COUNT(*) AS course_count
      FROM ( SELECT DISTINCT curriculum_id, course_id, Audit_ModifiedDateTime
             FROM IDENTIFIER(var_destination_catalog_name||'.`02_silver_tier_2`.fusionu_user_transcript_courses')
             WHERE is_curriculum = true
           )
      Group By curriculum_id
    )

    SELECT DISTINCT
      c.Curriculum_Key
      ,c.curriculum_id
      ,c.curriculum_name
      ,c.admin_notes
      ,c.course_pack_count
      ,cc.course_count 
      ,uc.curriculum_is_manual
      ,uc.curriculum_is_optional
      ,c.enrolled_user_count
      ,c.is_deleted
      ,c.Created as CreatedDate
      ,c.CreatedBy as CreatedById
      ,c.LastUpdated AS ModifiedDate
      ,c.UpdatedBy as ModifiedById
      ,c.IsDeleted_Datalake
      ,c.LastUpdated AS Audit_ModifiedDateTime
      ,current_timestamp() as RIGHTNOW

    FROM IDENTIFIER(var_destination_catalog_name||'.`02_silver_tier_1_fusionu`.curriculums_vw') c
    LEFT JOIN IDENTIFIER(var_destination_catalog_name||'.`02_silver_tier_2`.fusionu_user_curriculums') uc ON c.curriculum_id = uc.curriculum_id
    LEFT JOIN CourseCount cc on c.curriculum_id = cc.curriculum_id

    WHERE c.Audit_RowIsCurrent = true
          AND (COALESCE(c.LastUpdated, c.Created)>=CAST(var_max_audit_time AS TIMESTAMP)
                OR uc.Audit_ModifiedDateTime>=CAST(var_max_audit_time AS TIMESTAMP)
                OR cc.Audit_ModifiedDateTime>=CAST(var_max_audit_time AS TIMESTAMP)
              )
  Type: Text
