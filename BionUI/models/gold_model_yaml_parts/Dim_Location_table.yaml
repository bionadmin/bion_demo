- Name: GoldTableQuery
  Value: |-
    SELECT  
       FL.Location_Key
      ,FL.LocationId
      ,FL.Acronym
      ,FL.Name
      ,FL.BaseName
      ,FL.Division
      ,FL.Division_Key
      ,FL.DivisionAbbr
      ,FL.DivisionName
      ,FL.Company
      ,FL.Company_Key
      ,FL.CompanyAbbr
      ,FL.SystemUniqueKey
      ,FL.IsOpen
      ,FL.Country
      ,FL.Region
      ,FL.District
      ,FL.State
      ,FL.City
      ,FL.Street
      ,FL.PostalCode
      ,FL.Longitude 
      ,FL.Latitude 
      ,FL.Matrix_Campus_Key 
      ,FL.MatrixConversionDate 
      ,FL.TimeZoneId
      ,FL.TimeZoneInfoId 
      ,FL.TotalClassrooms 
      ,FL.Focus_School 
      ,FL.IsSalesRPT
      ,FL.ProfitCenter
      ,FL.PreOpenProfitCenter
      ,FL.HardLaunchDate
      ,FL.Email
      ,FL.Phone
      ,FL.Fax
      ,FL.WebAddress
      ,FL.FirstDayOfSchool
      ,FL.FacebookLink
      ,FL.CeebCode
      ,FL.AdmissionsModel
      ,FL.TeachingModel
      ,FL.PayrollAdminCode
      ,FL.PayrollTeacherCode AS PayrollTeacherAdminCode
      ,FL.TotalStations
      ,CASE WHEN ffl.FusionLocation_key IS NULL THEN TRUE  
       ELSE FALSE END AS NotConverted 
      ,FL.DistrictVicePresidentSalesforceId
      ,FL.DistrictVicePresidentSalesforceName
      ,FL.HeadOfSchoolSalesforceId
      ,FL.HeadOfSchoolSalesforceName
      ,FL.DirectorOfFirstImpressionsSalesforceId
      ,FL.DirectorOfFirstImpressionsSalesforceName
      ,FL.AccountSpecialistSalesforceId
      ,FL.AccountSpecialistSalesforceName
      ,FL.DirectorOfAdmissionsAndOutreachSalesforceId
      ,FL.DirectorOfAdmissionsAndOutreachSalesforceName
      ,FL.DirectorOfOutreachSalesforceId
      ,FL.DirectorOfOutreachSalesforceName
      ,FL.DirectorOfStudentDevelopmentSalesforceId
      ,FL.DirectorOfStudentDevelopmentSalesforceName
      ,FL.RegionalVicePresidentSalesforceId
      ,FL.RegionalVicePresidentSalesforceName
      ,FL.IsDeleted_DataLake
      ,FL.CreatedDate
      ,FL.CreatedById
      ,FL.LastModifiedDate
      ,FL.LastModifiedById
      ,FL.Audit_ModifiedDateTime
      ,current_timestamp() AS RIGHTNOW

    FROM  IDENTIFIER(var_destination_catalog_name||'.02_silver_tier_2.Fusion_Location') FL
        LEFT JOIN IDENTIFIER(var_destination_catalog_name||'.02_silver_tier_1_other.futuresfusionlocation') FFL
        ON FL.LocationId = FFL.FusionLocation_key

    WHERE FL.Audit_ModifiedDateTime > CAST(var_max_audit_time AS TIMESTAMP)
