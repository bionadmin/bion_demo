- Name: GoldTableQuery
  Value: |+
    SELECT DISTINCT
     PayPeriod_Key
    ,PayPeriod_Key as PayPeriod_KeyId
    ,PayrollDate
    ,ApprovalDeadline
    ,IsApproved
    ,ApprovalDate
    ,EffectiveDate
    ,TerminationDate
    ,CAST(EffectiveDate AS date) AS StartDate
    ,CAST(DATE_SUB(TerminationDate, 1) AS date) AS EndDate
    ,Description
    ,HashKey
    ,CreatedBy AS CreatedById
    ,Created AS CreatedDate
    ,UpdatedBy AS LastModifiedBy
    ,LastUpdated AS LastModifiedDate
    ,IsDeleted_DataLake
    ,Audit_ModifiedDateTime
    ,Audit_ModifiedDateTime AS Audit_Source_ModifiedDateTime
    ,current_timestamp() AS RIGHTNOW

    FROM IDENTIFIER(var_destination_catalog_name||".`02_silver_tier_1_matrix`.payperiod_vw")

    WHERE (Audit_ModifiedDateTime>CAST(var_max_audit_time AS TIMESTAMP))

  Type: Text
