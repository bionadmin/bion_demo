- Name: GoldTableQuery
  Value: |-
    SELECT
        AG.ApprovalGroup_Key AS PayrollApprovalGroup_Key
       ,AG.ApprovalGroup_Key AS PayrollApprovalGroupId
       ,AG.ApprovalGroup_Key AS SystemUniqueKey
       ,AG.Name
       ,AG.CreatedBy AS CreatedById
       ,AG.Created AS CreatedDate
       ,AG.UpdatedBy AS LastModifiedById
       ,AG.LastUpdated AS LastModifiedDate
       ,6 AS SourceSystem_Key
       ,AG.IsDeleted_DataLake
       ,AG.Audit_ModifiedDateTime
       ,current_timestamp() AS RIGHTNOW

      FROM IDENTIFIER(var_destination_catalog_name||".`02_silver_tier_1_matrix`.ApprovalGroup_vw") AG
          WHERE (
            AG.Audit_ModifiedDateTime>CAST(var_max_audit_time AS TIMESTAMP)
          )
