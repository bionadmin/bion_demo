- Name: GoldTableQuery
  Value: |-
    SELECT  
        Session_Key, 
        CAST(Session_Key_Int AS STRING) as SessionId,
        SystemUniqueKey,
        Class_Key,
        ClassSourcesystem_key,
        Product_Key,
    SessionDate_Key,
        ScheduleLocation_Key,
        Student_Key,
        Division_Key,
        StudentLocation_Key,
        ClientTypeAtTimeOfSession,
        Employee_Key,
        TeacherLocation_Key,
        Matrix_User_Key,
        IsEmployeeActive,
        User_key,
        StartTime,
        EndTime,
        LocalStartTime,
        LocalEndTime,
        IsVirtualSession,
        ClassSessionStatus_Key,
        Matrix_ClassSessionStatus_key,
        SessionNumber,
        ClassSessionDisplayName,
        ClassSessionStatus,
        DeliveryMethod_Key,
        Matrix_DeliveryMethod_Key,
        Delivery_Method,
        IsServiceAppointment,
        IsDeleted_Datalake,
        SessionRate,
        IsGroupClass,
        IsCloseoutSession,
        IsAssessment,
        PayCode_Key,
        PayCode,
        SessionCategory,
        TeacherAttendance,
        StudentAttendance,
        ReservationSeriesType,
        FirstScheduled,
        Company_Key,
        IsBillable,
        IsStatused,
        TaughtTime,
        TotalTime,
        Modality,
        SessionStatus,
        MatrixStatus,
        IsOffPeak,
        IsWeeklyTotalCappedByPromo,
        IsFlexAsync,
        IsCoaching,
        IsGroup,
        Program,
        Title,
        DifficultyLevelDisplayName,
        SessionType,
        CreatedDate,
        CreatedById,
        LastModifiedDate,
        LastModifiedById,
        Audit_ModifiedDateTime,  
        current_timestamp() AS RIGHTNOW,
        Product_Key as ProductId,
        PayCode_Key as PayCodeId,
        StudentLocationId,
        StudentId,
        StudentContactId,
        TeacherId,
        TeacherLocationId,
        ScheduleLocationId,
        IsAdditionalAppt,
        IsDiscretionaryBudget,
        ClassSecondaryName,
    EmployeeUniqueId,
    EmployeeUnique_Key 

    FROM IDENTIFIER(var_destination_catalog_name||".`02_silver_tier_2`.fusion_sessions")

    WHERE
     IsDiscretionary = FALSE
     AND ClassSessionStatus_Key <> 4
     AND (Audit_ModifiedDateTime>CAST(var_max_audit_time AS TIMESTAMP))
