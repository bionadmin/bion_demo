- Name: GoldTableQuery
  Value: |-
    SELECT
      student.StudentId
     ,student.ContactId
     ,student.SystemUniqueKey
     ,student.FirstName
     ,student.Middle_Name
     ,student.LastName
     ,student.Preferred_Name
     ,student.Student_Id_Mirror
     ,student.Status
     ,student.StatusCategory
     ,student.Division_Interest
     ,student.StudentType_Key
     ,student.StudentType
     ,student.Enrollment_Date
     ,student.Inactive_Date
     ,student.Graduation_Date
     ,student.Name
     ,student.Campus
     ,student.Gender
     ,student.Birthdate
     ,student.Email
     ,student.Phone
     ,student.Email AS Personal_Email
     ,student.MailingState
     ,student.MailingCity
     ,student.MailingStreet
     ,student.MailingPostalCode
     ,student.Citizenship
     ,student.AccountId
     ,student.School_Interested_In
     ,student.Grade_Interested_In
     ,student.GradeLevel
     ,student.First_Session_Date
     ,student.Authorization_to_Exchange_Information
     ,student.Field_Trip_Waiver
     ,student.Immunization_Records
     ,student.Media_release
     ,student.Permission_to_leave_campus
     ,student.Prior_Transcript_Received
     ,student.GradeUponArrival 
     ,student.CreatedDate
     ,student.CreatedById
     ,student.LastModifiedDate
     ,student.LastModifiedById
     ,student.Audit_ModifiedDateTime  
     ,current_timestamp() AS RIGHTNOW
     ,student.IsDeleted_DataLake
     ,sfl.id as InquiryId
     ,student.WithdrawalDate
     ,student.ExpectedGraduationDate 
     ,student.SourceSystem_Key 
     ,student.Country
     ,student.SeekingNCAA
     ,student.IsI20
     ,student.SalesforceAccountId
     ,student.RecordTypeName
     ,student.ReasonForWithdrawal
     ,student.ReasonForPause
     ,student.EstimatedReturnDate
     ,student.SchoolProgram
     ,student.Company_Key
     ,student.Matrix_Student_Key 
     ,student.Location_Key 
     ,dl.Location_KeyInt
     ,COALESCE(NULLIF(student.Division_Key, ''), 1) AS Division_Key
          FROM IDENTIFIER(var_destination_catalog_name||'.02_silver_tier_2.Fusion_Student') student
          LEFT JOIN IDENTIFIER(var_destination_catalog_name||'.02_silver_tier_1_salesforce.lead_vw') Sfl
            ON sfl.ConvertedContactId = student.SystemUniqueKey
          left join IDENTIFIER(var_destination_catalog_name||'.03_gold_operational.dim_location') dl
            ON student.Location_Key = dl.Location_Key
          WHERE
              student.Audit_ModifiedDateTime>CAST(var_max_audit_time AS TIMESTAMP)
              OR sfl.Audit_ModifiedDateTime>CAST(var_max_audit_time AS TIMESTAMP)
              OR dl.Audit_ModifiedDateTime>CAST(var_max_audit_time AS TIMESTAMP)
  Type: Text
- Name: InferMissingRecords
  Value: |-
    True
  Type: Boolean
- Name: UseHashKeys
  Value: |-
    True
  Type: Boolean
