- Name: GoldTableQuery
  Value: |-
    WITH LeadScheduledAM AS
    (
     -- Scheduled admissions meeting date from tasks
     SELECT 
       l.Id AS SystemUniqueKey
      ,MAX(t.CreatedDate) AS AdmissionsMeetingScheduledDateTime
     FROM IDENTIFIER(var_destination_catalog_name||'.02_silver_tier_1_salesforce.Lead_vw') l
     INNER JOIN IDENTIFIER(var_destination_catalog_name||'.02_silver_tier_1_salesforce.Task_vw') t
     ON t.WhoId = l.Id AND t.Report_Category__c IN ('Intake Scheduled', 'Intake Rescheduled')

     WHERE t.IsDeleted_DataLake = False
     AND l.RecordTypeName__c IN ('Admissions', 'Barnstable')
     GROUP BY l.Id
    ),
    LeadScheduledAM_LessThan AS
    (
     -- Scheduled admissions meetings where the task created date is less than or equal to AM date
     SELECT 
      l.Id AS SystemUniqueKey
      , MAX(t.CreatedDate) AS AdmissionsMeetingScheduledDateTime
     FROM IDENTIFIER(var_destination_catalog_name||'.02_silver_tier_1_salesforce.Lead_vw') l
     INNER JOIN IDENTIFIER(var_destination_catalog_name||'.02_silver_tier_1_salesforce.Task_vw') t
     ON t.WhoId = l.Id
     AND t.Report_Category__c IN ('Intake Scheduled', 'Intake Rescheduled')
     AND CAST(t.CreatedDate AS DATE) <= CAST(l.Intake_Date__c AS DATE)

     WHERE t.IsDeleted_DataLake = False
     AND l.RecordTypeName__c IN ('Admissions', 'Barnstable')
     GROUP BY l.Id
    ),

    pardotLookup_CTE AS
    (
     SELECT DISTINCT PardotCampaign, AttributionSource 
     FROM IDENTIFIER(var_destination_catalog_name||'.02_silver_tier_1_other.pardotLookup')
    ),

    Employee AS
    (
        SELECT EmployeeUniqueId, Employee_Key, EmployeeId, EmployeeNbr, UserName, LastName, FirstName, LocationId
        FROM (
            SELECT EmployeeUniqueId, Employee_Key, EmployeeId, EmployeeNbr, UserName, LastName, FirstName, LocationId,
            row_number() OVER (PARTITION BY EmployeeId ORDER BY Audit_Source_ModifiedDateTime DESC) AS rn
            FROM IDENTIFIER(var_destination_catalog_name||'.02_silver_tier_2.Fusion_Employee')
            )
        WHERE rn = 1
    )

     SELECT
       l.Id AS SystemUniqueKey
      ,l.Id AS LeadId
      ,l.Id AS Admissions_Lead_Key
      ,l.ConvertedContactId AS ContactId
      ,l.ConvertedAccountId AS AccountId

      ,CASE 
          WHEN (COALESCE(pl.AttributionSource, 'Miscellaneous') = 'Miscellaneous') AND (COALESCE(hl.AttributionSource, 'Pardot') IN ('Pardot', 'Miscellaneous')) THEN '4'
       WHEN (COALESCE(pl.AttributionSource, 'Miscellaneous') = 'Miscellaneous')
               AND hl.AttributionSource IS NOT NULL
               AND hl.AttributionSource NOT IN ('Pardot', 'Miscellaneous')
              THEN CAST(da2.Attribution_Key AS STRING)
          ELSE CAST(da.Attribution_Key AS STRING)
       END AS foreign_Attribution_Key_AttributionID

      ,l.School_Interested_In__c AS Location_Key
      ,l.School_Interested_In__c AS foreign_Location_Key_LocationId
      ,l.Referring_Professional_del__c AS Professional_Key
      ,l.Referring_Professional_del__c AS foreign_Professional_Key_ParentId
      ,l.Referring_Parent_Contact__c AS Parent_Key
      ,l.Referring_Parent_Contact__c AS foreign_Parent_Key_ParentId
    ,COALESCE(CAST(E.EmployeeUniqueId AS STRING),'NULL') AS EmployeeUnique_Key 
    ,COALESCE(CAST(E.EmployeeUniqueId AS STRING),'NULL') AS foreign_EmployeeUnique_Key_EmployeeUniqueId
      ,l.Originally_Created_Date__c AS OriginallyCreatedDate_Key
      ,l.Actual_Date_of_Tour__c AS VisitDate_Key

      ,CASE
          WHEN l.Intake_Date__c IS NULL THEN am.AdmissionsMeetingScheduledDateTime
          WHEN l.Intake_Date__c IS NOT NULL AND COALESCE(LOWER(l.Intake_Completed__c), 'true') = 'true' THEN am.AdmissionsMeetingScheduledDateTime
          ELSE am2.AdmissionsMeetingScheduledDateTime
       END AS AdmissionsMeetingScheduledDate_Key

      ,l.Intake_Date__c AS AdmissionsMeetingDate_Key
      ,l.DQ_Date__c AS DisqualifiedDate_Key
      ,l.OwnerId
      ,l.IsConverted
      ,l.FirstName
      ,l.LastName
      ,l.Name AS FullName
      ,l.Lifecycle_Status_del__c AS LifecycleStatus
      ,l.Intake_Completed__c AS AdmissionsMeetingCompleted
      ,l.DQ__c AS IsDisqualified
      ,l.Inactive_Disqualified_Reason__c AS DisqualifiedReason
      --,l.Referring_Professional_del__c AS ReferringPro_SystemUniqueKey
      --,l.Referring_Parent_Contact__c AS ReferringParent_SystemUniqueKey
      ,l.Campaign_Source__c AS CampaignSource
      ,l.How_Did_You_Hear_About_Us__c AS HDYOHAU
      ,l.Division_Interest__c AS DivisionInterest
      ,l.Buxton_Score__c AS BuxtonScore
      ,l.Initial_Engagement_Score__c AS InitialEngagementScore
      ,l.First_Task_Completed__c AS FirstTaskCompletedDateTime

      , CASE
       WHEN l.First_Task_Completed__c IS NULL THEN 0
       ELSE 1 
        END AS HasFirstTaskCompleted

      ,l.Last_Completed_Activity__c AS LastActivityDate
      ,l.Next_Activity_Date__c AS NextActivityDate
      ,l.IsDeleted_DataLake
      ,NULL AS FilterDate
        ,L.CreatedDate 
         ,L.CreatedById
         ,L.LastModifiedDate
         ,L.LastModifiedById
         ,L.Audit_ModifiedDateTime 
         ,current_timestamp() AS RIGHTNOW
     FROM IDENTIFIER(var_destination_catalog_name||'.02_silver_tier_1_salesforce.Lead_vw') L
      LEFT JOIN pardotLookup_CTE PL
      ON PL.PardotCampaign = L.Campaign_Source__c
      LEFT JOIN IDENTIFIER(var_destination_catalog_name||'.02_silver_tier_1_other.hdyohaulookup') HL
      ON HL.HDYOHAU = L.How_Did_You_Hear_About_Us__c
      LEFT JOIN IDENTIFIER(var_destination_catalog_name||'.02_silver_tier_1_other.Attribution') DA
      ON DA.AttributionSource = PL.AttributionSource
      LEFT JOIN IDENTIFIER(var_destination_catalog_name||'.02_silver_tier_1_other.Attribution') DA2
      ON DA2.AttributionSource = HL.AttributionSource
      LEFT JOIN LeadScheduledAM AM
      ON AM.SystemUniqueKey = L.Id
      LEFT JOIN LeadScheduledAM_LessThan AM2
      ON AM2.SystemUniqueKey = L.Id
      LEFT JOIN Employee E ON TRIM(l.OwnerId) = TRIM(E.EmployeeId)

     WHERE (L.Audit_ModifiedDateTime > CAST(var_max_audit_time AS TIMESTAMP))
     AND l.RecordTypeName__c IN ('Admissions','Barnstable')
  Type: Text
