- Name: GoldTableQuery
  Value: |-
    , 
    Exclusion_CTE AS (
     SELECT 
        ID, 
        Name,
        Audit_ModifiedDateTime
    FROM IDENTIFIER(var_destination_catalog_name||'.02_silver_tier_1_salesforce.Course__c_vw')
    WHERE 
        LOWER(Name) RLIKE '(flex|tutoring|independent pe|prepaid|tm|post secondary|ll tech|makerspace|ll open art|work experience|mentor|learning)'
    ),

    Employee AS
    (
        SELECT EmployeeUniqueId, Employee_Key, EmployeeId, EmployeeNbr, UserName, LastName, FirstName, LocationId, Audit_ModifiedDateTime
        FROM (
            SELECT EmployeeUniqueId, Employee_Key, EmployeeId, EmployeeNbr, UserName, LastName, FirstName, LocationId, Audit_ModifiedDateTime,
            row_number() OVER (PARTITION BY EmployeeId ORDER BY Audit_Source_ModifiedDateTime DESC) AS rn
            FROM IDENTIFIER(var_destination_catalog_name||'.02_silver_tier_2.Fusion_Employee')
            )
        WHERE rn = 1
    )

    SELECT
             CS.Id AS Charting_Completion_Key
            ,CS.Id AS Charting_CompletionId
            ,SS.Student__c AS Student_Key
            ,SS.Student__c AS foreign_Student_Key_ContactId
            ,SS.Id AS Student_Session_Key
            ,SS.Id AS foreign_Student_Session_Key_Student_SessionId
            ,SS.Id AS Student_SessionId
            ,CS.Id AS foreign_Course_Section_Key_Course_SectionId
            ,CS.Id  AS Course_Section_Key
            ,COALESCE(CAST(E.EmployeeUniqueId AS STRING),'NULL') AS EmployeeUnique_Key 
            ,COALESCE(CAST(E.EmployeeUniqueId AS STRING),'NULL') AS foreign_EmployeeUnique_Key_EmployeeUniqueId
            ,E.EmployeeUniqueId
            ,SS.Teacher__c as EmployeeId
            ,CS.School__c AS Location_Key
            ,CS.School__c AS foreign_Location_Key_LocationId
            ,CAST(SS.Start_Date__c as date) AS Session_Date_Key
            ,CAST(SS.Start_Date__c as date)  AS foreign_Session_Date_FullDate
            ,SS.Session_Number__c AS SessionNumber
            ,CS.Class_Status__c AS ClassStatus
            ,CASE
                WHEN SS.Attendance__c = 'Attended' AND  SS.Has_Public_Notes__c =1
                THEN 1
                ELSE 0
                END AS IsCharted
            ,SS.Attendance__c AS Attendance
            ,CASE
                WHEN ss.Attendance__c IS NOT NULL THEN 1
                ELSE 0
                END AS HasAttendance
            ,CASE
                WHEN ss.Attendance__c = 'Attended' THEN 1
                ELSE 0
                END AS IsAttended
            ,CS.CreatedDate
            ,CS.CreatedById
            ,CS.LastModifiedDate
            ,CS.LastModifiedById
            ,CAST(SS.Start_Date__c as date) AS FilterDate
            ,CS.Audit_ModifiedDateTime
            ,current_timestamp() AS RIGHTNOW
            ,CASE WHEN EXL.Id IS NULL THEN 0 ELSE 1 END AS CourseNameFlag
            ,CASE WHEN CS.Isdeleted_DataLake = TRUE OR SS.Isdeleted_DataLake = TRUE THEN TRUE ELSE FALSE END AS IsDeleted_DataLake

        FROM IDENTIFIER(var_destination_catalog_name||'.02_silver_tier_1_salesforce.Student_Session__c_vw') SS
            LEFT JOIN IDENTIFIER(var_destination_catalog_name||'.02_silver_tier_1_salesforce.Course_Section__c_vw') CS
            ON CS.Id = SS.Course_Section_Id__c
            LEFT JOIN IDENTIFIER(var_destination_catalog_name||'.02_silver_tier_1_salesforce.Course__c_vw') C
            ON C.Id = CS.Course__c
            LEFT JOIN Exclusion_CTE EXL
            ON EXL.Id = C.Id
            LEFT JOIN Employee E 
            ON TRIM(E.EmployeeId) = TRIM(SS.Teacher__c)

        WHERE  SS.Session_Number__c IS NOT NULL
               AND SS.Session_Number__c >= 1
               AND (SS.Audit_ModifiedDateTime>CAST(var_max_audit_time AS TIMESTAMP)
                    OR CS.Audit_ModifiedDateTime>CAST(var_max_audit_time AS TIMESTAMP)
                    OR C.Audit_ModifiedDateTime>CAST(var_max_audit_time AS TIMESTAMP)
                    OR EXL.Audit_ModifiedDateTime>CAST(var_max_audit_time AS TIMESTAMP)
                    OR E.Audit_ModifiedDateTime>CAST(var_max_audit_time AS TIMESTAMP)
                    )
  Type: Text
