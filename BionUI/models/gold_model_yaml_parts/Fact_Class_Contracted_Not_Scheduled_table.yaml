- Name: Custom Pre Query Cell
  Value: |-
    %sql
    -- onprem is a view so need to truncate table every time
    TRUNCATE TABLE IDENTIFIER(var_destination_catalog_name||'.03_gold_operational'||'.Fact_Class_Contracted_Not_Scheduled')
  Type: Text
- Name: Custom Pre Query Cell Enabled
  Value: |-
    True
  Type: Boolean
- Name: Dest Change Data Feed Enabled
  Value: |-
    Inherit
  Type: ThreeStateBoolean
- Name: Dest PK Constraints Enabled
  Value: |-
    Inherit
  Type: ThreeStateBoolean
- Name: GoldTableQuery
  Value: |-
    , DimDateSemester AS
    (
    SELECT
     AcademicSemesterKey
     , AcademicSemester 
     , AcademicYearDesc
     , MIN(FullDate) AS TheFirstOfAcademicSemester
    FROM IDENTIFIER(var_destination_catalog_name||'.02_silver_tier_2.fusion_date')
    GROUP BY AcademicSemesterKey, AcademicSemester, AcademicYearDesc
    )

    , AcademicYear AS (
      SELECT DISTINCT AcademicYearDesc, CurrentAcademicYearOffset
      FROM IDENTIFIER(var_destination_catalog_name||'.02_silver_tier_2.fusion_date')
      WHERE CurrentAcademicYearOffset >= -1
    )

    , FactClassRevised AS
    (
    SELECT DISTINCT
      oli.Id
      , 1 AS SourceSystem_Key --Fusion Salesforce 
      , fc.Contract_Key
      , o.Contract_Number__c
      , oli.OpportunityId
      , o.Estimated_Student_Start_Date__c
      , CASE
          WHEN dd.AcademicYearDesc IS NULL THEN o.Enrollment_Year__c
          ELSE dd.AcademicYearDesc
          END AS EnrollmentYear
      , CASE
          WHEN lower(o.Semester__c) = 'full year' THEN 'Full Year'
          ELSE dd.AcademicSemester
          END AS ContractSemester
      , p.product_key
      , p.SystemUniqueKey ProductId
      , p.ProductCode Product_Code__c
      , p.Name Product_Name__c
      , Estimated_Start_Date__c
      , oli.Semester__c ClassSemester
      , CASE
          WHEN lower(o.Contract_Type__c) = 'parent contract for district students' AND lower(o.Semester__c) = 'full year' AND lower(oli.Semester__c) NOT IN ('fall', 'winter', 'spring', 'summer') THEN dd.AcademicSemester --Full Year district funded
          WHEN lower(o.Contract_Type__c) = 'parent contract for district students' AND lower(o.Semester__c) = 'full year' THEN oli.Semester__c --Full Year district funded
          WHEN o.Semester_Count__c > 1 AND oli.Estimated_Start_Date__c IS NOT NULL THEN ddEstStartDate.AcademicSemester --Estimated_Start_Date__c is filled out
          WHEN dd.AcademicSemester IS NULL THEN ddSemester.AcademicSemester --Estimated_Student_Start_Date__c IS NULL OR date does not fall within Dim_Date
          ELSE dd.AcademicSemester --based on Estimated_Student_Start_Date__c
          END AS Semester
      , CASE
          WHEN lower(o.Contract_Type__c) = 'parent contract for district students' AND lower(o.Semester__c) = 'full year' AND lower(oli.Semester__c) NOT IN ('fall', 'winter', 'spring', 'summer') THEN dd.AcademicSemesterKey
          WHEN lower(o.Contract_Type__c) = 'parent contract for district students' AND lower(o.Semester__c) = 'full year' THEN ddOLISemester.AcademicSemesterKey --Full Year district funded
          WHEN o.Semester_Count__c > 1 AND oli.Estimated_Start_Date__c IS NOT NULL THEN ddEstStartDate.AcademicSemesterKey
          WHEN dd.AcademicSemesterKey IS NULL THEN ddSemester.AcademicSemesterKey
          ELSE dd.AcademicSemesterKey --based on Opportunity.Estimated_Student_Start_Date__c
          END AS AcademicSemesterKey
      , oli.Curriculum_Level__c
      , oli.Course_Map__c CoursePacing
      , Quantity
      , UnitPrice
      , TotalPrice
      , On_Credit_Memo__c
      , p.IsSchedulable
      , 0 AS IsPAYG
      , modality.Modality
      , ds.Student_Key
      , ds.StudentID
      , CASE WHEN oli.IsDeleted_Datalake = TRUE OR ocr.IsDeleted_DataLake = TRUE THEN TRUE ELSE FALSE END AS IsDeleted_Datalake

     FROM IDENTIFIER(var_destination_catalog_name||'.02_silver_tier_1_salesforce.opportunitylineitem_vw') oli 
      INNER JOIN IDENTIFIER(var_destination_catalog_name||'.03_gold_operational.dim_product') p 
       ON p.SystemUniqueKey = oli.Product2Id
      INNER JOIN IDENTIFIER(var_destination_catalog_name||'.02_silver_tier_1_salesforce.opportunity_vw') o
       ON o.Id = oli.OpportunityId
      INNER JOIN IDENTIFIER(var_destination_catalog_name||'.02_silver_tier_1_salesforce.opportunitycontactrole_vw') ocr
       ON ocr.OpportunityId = o.Id
       AND ocr.IsPrimary = true
      INNER JOIN IDENTIFIER(var_destination_catalog_name||'.02_silver_tier_2.fusion_student') ds
       ON ocr.ContactId = ds.systemuniquekey 
      LEFT JOIN IDENTIFIER(var_destination_catalog_name||'.02_silver_tier_2.fusion_date') dd
       ON dd.FullDate = CAST(o.Estimated_Student_Start_Date__c as date)
      LEFT JOIN DimDateSemester ddSemester
       ON ddSemester.AcademicYearDesc = o.Enrollment_Year__c
       AND ddSemester.AcademicSemester = o.Semester__c
      LEFT JOIN IDENTIFIER(var_destination_catalog_name||'.02_silver_tier_2.fusion_date') ddEstStartDate 
       ON ddEstStartDate.FullDate = CAST(oli.Estimated_Start_Date__c as date)
      LEFT JOIN DimDateSemester ddOLISemester
       ON ddOLISemester.AcademicYearDesc = dd.AcademicYearDesc
       AND ddOLISemester.AcademicSemester = oli.Semester__c
      LEFT JOIN IDENTIFIER(var_destination_catalog_name||'.03_gold_operational.fact_contract') fc
       ON o.id = fc.ContractId
      LEFT JOIN IDENTIFIER(var_destination_catalog_name||'.02_silver_tier_2.fusion_product_modality_vw') modality
       ON p.productid = modality.Product_Key
     WHERE oli.IsDeleted_Datalake = false
      AND oli.On_Credit_Memo__c = false
      AND lower(o.RecordTypeName__c) <> 'barnstable'
      AND CAST(o.CreatedDate AS Date) > DATEADD(year,-7,Getdate())
    )

    SELECT
     ds.SystemUniqueKey AS ContactId
     , fcr.StudentId AS StudentId
     , CONCAT( ds.FirstName, ' ', ds.LastName) AS StudentName
     , ds.FirstName
     , ds.LastName
     , ds.Status AS StudentStatus
     , fcr.OpportunityId AS OpportunityId
     , fcr.Contract_Number__c AS Contract_Number
     , o.School_Interested_In__c AS School_Interested_In
     , o.RecordTypeName__c AS RecordTypeName
     , o.Contract_Type__c AS Contract_Type
     , o.StageName
     , o.Completed__c as Completed
     , fcr.Estimated_Student_Start_Date__c AS Estimated_Student_Start_Date
     , fcr.Estimated_Start_Date__c AS Estimated_Start_Date
     , CASE
        WHEN dd.AcademicSemesterKey = fcr.AcademicSemesterKey THEN fcr.Estimated_Start_Date__c
        WHEN dd2.AcademicSemesterKey = fcr.AcademicSemesterKey THEN fcr.Estimated_Student_Start_Date__c
        ELSE ddSemester.TheFirstOfAcademicSemester 
        END AS Estimated_Start_Date_Updated
     , o.Contract_Created__c as Contract_Created_Date
     , o.Contract_Completed_Date__c AS Contract_Completed_Date
     , o.Semester__c AS Contract_Semester
     , fcr.Semester
     , fcr.AcademicSemesterKey
     , fcr.EnrollmentYear AS Enrollment_Year
     , fcr.Id AS OpportunityLineItemId
     , oli.OriginatingLineItemId__c AS OriginatingLineItemId
     , fcr.On_Credit_Memo__c AS OnCreditMemo
     , fcr.Product_Code__c AS ProductCode
     , p.Name AS ProductName
     , oli.Great_Plains_Name__c AS GreatPlainsName
     , fcr.Quantity AS ContractedSessions
     , fcr.UnitPrice
     , fcr.TotalPrice
     , coalesce(oli.Scheduling_Status__c, 'Active') AS Scheduling_Status
     , oli.Estimated_Return_Date__c AS Estimated_Return_Date
     , p.BICategory AS Department_For_BI
     , p.DepartmentName AS Department
     ,fcr.isdeleted_datalake as IsDeleted_Datalake
     ,o.Audit_ModifiedDateTime
     ,current_timestamp() AS RIGHTNOW--leave this.

    FROM FactClassRevised fcr
     LEFT JOIN IDENTIFIER(var_destination_catalog_name||'.02_silver_tier_2.fusion_student') ds
      ON ds.Student_Key = fcr.Student_Key
     LEFT JOIN IDENTIFIER(var_destination_catalog_name||'.02_silver_tier_1_salesforce.opportunity_vw') o
      ON o.Id = fcr.OpportunityId
     LEFT JOIN IDENTIFIER(var_destination_catalog_name||'.02_silver_tier_1_salesforce.opportunitylineitem_vw') oli
      ON oli.Id = fcr.Id
     LEFT JOIN IDENTIFIER(var_destination_catalog_name||'.03_gold_operational.dim_product') p
      ON p.Product_Key = fcr.Product_Key
     INNER JOIN AcademicYear d
      ON d.AcademicYearDesc = o.Enrollment_Year__c
     LEFT JOIN IDENTIFIER(var_destination_catalog_name||'.02_silver_tier_2.fusion_date') dd
      ON dd.fullDate = CAST(fcr.Estimated_Start_Date__c as date)
     LEFT JOIN IDENTIFIER(var_destination_catalog_name||'.02_silver_tier_2.fusion_date') dd2
      ON dd2.FullDate = CAST(fcr.Estimated_Student_Start_Date__c as date)
     LEFT JOIN DimDateSemester ddSemester
      ON ddSemester.AcademicSemesterKey = fcr.AcademicSemesterKey

    WHERE (o.Completed__c = true OR lower(o.StageName) IN ('created','awaiting signature'))
     AND lower(oli.ProductCode) NOT LIKE '%regist%'
     AND lower(oli.ProductCode) NOT LIKE '%fee%'
     AND lower(oli.ProductCode) NOT LIKE '%discount%'
     AND lower(oli.ProductCode) <> 'fasyncsession'
     AND p.IsSchedulable = true
     AND lower(fcr.Modality) <> 'payg tutoring'
