- Name: GoldTableQuery
  Value: |-
    SELECT 
         FC.ContractNumber
        ,NULL AS NPA_ContractNumber
        ,NULL AS NPA_Contract_key
        ,FC.ContractNumber_Key AS Contract_key
        ,FC.SystemUniqueKey AS ContractId
        ,FC.ContractCreatedDate
        ,FC.ContractClosedDate
        ,FC.ContractReturned
        ,FC.ContractStage
        ,FC.EstimatedStudentStartDate
        ,NULL AS EstimatedStudentEndDate
        ,FC.OriginalAmount
        ,NULL AS ScholarshipAmount
        ,NULL AS PromotionAmount
        ,FC.TotalDue 
        ,FC.EnrollmentYear
        ,FC.Semester
        ,NULL AS Fall
        ,NULL AS Summer
        ,NULL AS Spring
        ,FC.IsCompleted
        ,FC.ContractSigned
        ,FC.DateInvoiced
        ,FC.IsInvoiced
        ,FC.IsPaid
        ,FC.NumberOfInvoices
        ,FC.PaymentTerms
        ,CAST(FC.ContactId AS STRING) AS foreign_Student_Key_ContactId
        ,CAST(FC.StudentId AS STRING) AS StudentId
        ,CAST(FC.LocationId AS STRING) AS foreign_Location_Key_LocationId
        ,CAST(FC.LocationChanged AS BOOLEAN) AS LocationChanged
        ,try_cast(FC.LocationChangedDate AS TIMESTAMP) LocationChangedDate
        ,COALESCE(CAST(FC.Matrix_Contract_Key AS BINARY), NULL) AS Matrix_Contract_Key
        ,COALESCE(CAST(FC.PreviousLocation_Key AS BINARY), NULL) AS PreviousLocation_Key
        ,FC.Name
        ,FC.RecordTypeName
        ,FC.Company_Key
        ,FC.IsDeleted_DataLake
        ,FC.CreatedDate
        ,FC.CreatedById
        ,FC.Semester_Count
        ,FC.Contract_Type
        ,FC.Discount_Amount
        ,NULL AS FilterDate
        ,FC.Audit_ModifiedDateTime AS LastModifiedDate
        ,FC.ModifiedById AS LastModifiedById
        ,FC.Audit_ModifiedDateTime AS Audit_ModifiedDateTime
        ,current_timestamp() AS RIGHTNOW
            FROM IDENTIFIER(var_destination_catalog_name||".02_silver_tier_2.Fusion_Contract") FC  
            WHERE  (FC.Audit_ModifiedDateTime>CAST(var_max_audit_time AS TIMESTAMP))
  Type: Text
