- Name: GoldTableQuery
  Value: |-
    ,Exclusion_CTE AS (
     SELECT
        ID,
        Name,
        Audit_modifiedDateTime
    FROM IDENTIFIER(var_destination_catalog_name||'.02_silver_tier_1_salesforce.Course__c_vw')
    WHERE
        LOWER(Name) RLIKE '(seminar|prepaid TM|TM|flex|independent pe|learning lab|ll open|post secondary|pre paid|prepaid|tutoring|learning|mentor)'
    ),

    Employee AS
    (
        SELECT EmployeeUniqueId, Employee_Key, EmployeeId, EmployeeNbr, UserName, LastName, FirstName, LocationId, Audit_modifiedDateTime
        FROM (
            SELECT EmployeeUniqueId, Employee_Key, EmployeeId, EmployeeNbr, UserName, LastName, FirstName, LocationId, Audit_modifiedDateTime,
            row_number() OVER (PARTITION BY EmployeeId ORDER BY Audit_Source_ModifiedDateTime DESC) AS rn
            FROM IDENTIFIER(var_destination_catalog_name||'.02_silver_tier_2.Fusion_Employee')
            )
        WHERE rn = 1
    )

    SELECT
             CS.Id AS Course_Closure_Key
            ,CS.Id AS Course_ClosureId
            ,CSS.Student__c AS Student_Key
            ,CSS.Student__c AS foreign_Student_Key_ContactId     
            ,COALESCE(CAST(E.EmployeeUniqueId AS STRING),'NULL') AS EmployeeUnique_Key 
            ,COALESCE(CAST(E.EmployeeUniqueId AS STRING),'NULL') AS foreign_EmployeeUnique_Key_EmployeeUniqueId
            ,E.EmployeeUniqueId
            ,CS.Primary_Teacher__c as EmployeeId
            ,CS.Id AS Course_Section_Key
            ,CS.Id AS foreign_Course_Section_Key_Course_SectionId
            ,CS.School__c AS Location_Key
            ,CS.School__c AS foreign_Location_Key_LocationId
            ,CAST(CSS.Teacher_Closed_Date__c AS STRING) AS CourseSessionID
            ,CSS.Teacher_Closed_Date__c AS TeacherClosedDate
            ,CSS.Teacher_Closed_Date__c AS TeacherClosedDate_Key
            ,CASE
                  WHEN try_divide(CAST(substring_index(CSS.Course_Attendance__c, '/', 1) AS DOUBLE), CAST(substring_index(CSS.Course_Attendance__c, '/', -1) AS DOUBLE)) > 0.9 THEN 1
                  ELSE 0
                  END AS AttendanceFlag
            ,CASE
                  WHEN CSS.Teacher_Closed_Date__c IS NOT NULL THEN 1
                  ELSE 0
                  END AS IsClosed

            ,CSS.Last_Scheduled_Session_Date__c AS LastScheduledSessionDate
            ,CSS.Last_Scheduled_Session_Date__c AS LastScheduledSessionDate_Key
            ,CSS.ID AS Course_Section_StudentId
            --,CST.ID AS Course_Section_TeacherId
            ,C.ID AS Course__cId
            ,P2.ID AS Product2Id
            ,P2.Exclude_From_Transcript__c AS ExcludeTranscript
            ,CSS.CreatedDate
            ,CSS.CreatedById
            ,CSS.LastModifiedDate
            ,CSS.LastModifiedById
            ,CSS.Last_Scheduled_Session_Date__c AS FilterDate
            ,CSS.Audit_ModifiedDateTime
            ,current_timestamp() AS RIGHTNOW
            ,CASE WHEN EXL.Id IS NULL THEN 0 ELSE 1 END AS CourseNameFlag
            ,CASE
        WHEN CSS.Last_Scheduled_Session_Date__c < DATE_ADD(CURRENT_DATE(), -14)
             AND (CASE WHEN CSS.Teacher_Closed_Date__c IS NOT NULL THEN 1 ELSE 0 END = 0)
        THEN TRUE
        ELSE FALSE
    END AS IsPastDue

    , DATEDIFF(DATE_ADD(CURRENT_DATE(), -14),
               CAST(CSS.Last_Scheduled_Session_Date__c AS DATE)) AS DaysPastDue

        ,C.LMS_Type__c AS LMSType
        ,CSS.Class_Status__c AS ClassStatus
        ,CSS.Audit_Completed__c AS AuditCompleted
        ,CSS.Ready_for_Review__c AS ReadyForReview
        ,CASE WHEN CS.IsDeleted_DataLake = TRUE OR CSS.IsDeleted_DataLake = TRUE THEN TRUE ELSE FALSE END AS IsDeleted_Datalake
    FROM IDENTIFIER(var_destination_catalog_name||'.02_silver_tier_1_salesforce.Course_Section__c_vw') CS
            LEFT JOIN IDENTIFIER(var_destination_catalog_name||'.02_silver_tier_1_salesforce.Course_Section_Student__c_vw') CSS
            ON CSS.Course_Section__c = CS.Id
            LEFT JOIN IDENTIFIER(var_destination_catalog_name||'.02_silver_tier_1_salesforce.Course__c_vw') C
            ON C.Id = CS.Course__c
            LEFT JOIN IDENTIFIER(var_destination_catalog_name||'.02_silver_tier_1_salesforce.Product2_vw') P2
            ON C.Product__c = P2.Id
            LEFT JOIN Exclusion_CTE EXL
            ON EXL.Id = C.Id
            LEFT JOIN Employee E
            ON TRIM(E.EmployeeId) = TRIM(CS.Primary_Teacher__c)

     WHERE CS.Audit_ModifiedDateTime>CAST(var_max_audit_time AS TIMESTAMP)
            OR CSS.Audit_ModifiedDateTime>CAST(var_max_audit_time AS TIMESTAMP)
            OR C.Audit_ModifiedDateTime>CAST(var_max_audit_time AS TIMESTAMP)
            OR P2.Audit_ModifiedDateTime>CAST(var_max_audit_time AS TIMESTAMP)
            OR EXL.Audit_ModifiedDateTime>CAST(var_max_audit_time AS TIMESTAMP)
            OR E.Audit_ModifiedDateTime>CAST(var_max_audit_time AS TIMESTAMP)
  Type: Text
