- Name: GoldTableQuery
  Value: |-
    SELECT
           ED.EmergencyDrillId AS Emergency_Drill_Key
          ,ED.EmergencyDrillId AS Emergency_DrillId
          ,LOC.Id AS Location_Key
          ,LOC.Id AS foreign_Location_Key_LocationId
          ,ED.EmergencyDrillDate AS EmergencyDate_Key
          ,ED.EmergencyDrillDate AS foreign_EmergencyDate_Key_FullDate
          ,ED.Numerator
          ,ED.Denominator
          ,ED.CreatedDate
          ,ED.CreatedById
          ,ED.Audit_ModifiedDateTime
          ,current_timestamp() AS RIGHTNOW
          ,ED.EmergencyDrillDate AS FilterDate
        FROM IDENTIFIER(var_destination_catalog_name||'.02_silver_tier_2.fusion_emergencydrill') ED
        LEFT JOIN IDENTIFIER(var_destination_catalog_name||'.02_silver_tier_1_salesforce.New_Schools__c_vw') LOC
        ON ED.Campus = LOC.base_name__c
            WHERE (ED.Audit_ModifiedDateTime>CAST(var_max_audit_time AS TIMESTAMP)
                  OR LOC.Audit_ModifiedDateTime>CAST(var_max_audit_time AS TIMESTAMP)
                  )
            AND LOC.IsDeleted_DataLake = false
  Type: Text
- Name: InferMissingRecords
  Value: |-
    True
  Type: Boolean
