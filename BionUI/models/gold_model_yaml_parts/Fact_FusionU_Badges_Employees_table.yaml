- Name: GoldTableQuery
  Value: |-
    SELECT DISTINCT 
    sha2(CONCAT_WS('|'
             ,CAST(COALESCE(ub.EmployeeNbr, '-1') AS STRING)
             ,CAST(COALESCE(ub.badge_id, b.BadgeID) AS STRING) 
             ,CAST(COALESCE(ub.badge_name, b.BadgeName) AS STRING) 
             ,COALESCE(CAST(ub.badge_status AS STRING), '-1') 
             ,COALESCE(CAST(ub.badge_date_earned AS STRING), '-1') ) 
             , 256) AS Employee_Badge_Key
    ,concat(COALESCE(CAST(ub.badge_id AS STRING), CAST(b.BadgeID AS STRING)), COALESCE(CAST(ub.EmployeeNbr AS STRING), '-1')) AS Employee_Badge_Id
    ,b.Badge_Key
    ,COALESCE(ub.badge_id, b.BadgeID) as Badge_Id
    ,b.BadgeName
    ,b.Description as Badge_Description
    ,ub.User_Key as FusionU_User_Key
    ,ub.user_id as FusionU_User_Id
    ,COALESCE(CAST(e.EmployeeUniqueId AS STRING),'NULL') AS EmployeeUnique_Key 
    ,COALESCE(CAST(e.EmployeeUniqueId AS STRING),'NULL') AS foreign_EmployeeUnique_Key_EmployeeUniqueId
    ,e.EmployeeUniqueId
    ,COALESCE(CAST(e.EmployeeId AS STRING),'NULL') AS Employee_Key 
    ,COALESCE(CAST(e.EmployeeId AS STRING),'NULL') AS foreign_Employee_Key_EmployeeId
    ,e.EmployeeId
    ,ub.EmployeeNbr
    ,ub.badge_date_earned
    ,ub.badge_status
    ,COALESCE(ub.CreatedDate, b.Created) as CreatedDate
    ,COALESCE(ub.CreatedById, b.CreatedBy) as CreatedById
    ,COALESCE(ub.LastModifiedDate, b.LastUpdated) as LastModifiedDate
    ,COALESCE(ub.LastModifiedById, b.UpdatedBy) as LastModifiedById
    ,CASE WHEN ub.IsDeleted_Datalake = TRUE or b.IsDeleted_Datalake = TRUE THEN TRUE ELSE FALSE END AS IsDeleted_Datalake
    ,COALESCE(ub.Audit_ModifiedDateTime, b.Load_Date_Time) AS Audit_ModifiedDateTime
    ,COALESCE(ub.Audit_Source_ModifiedDateTime, b.Load_Date_Time) AS Audit_Source_ModifiedDateTime
    ,current_timestamp() AS RIGHTNOW

    FROM IDENTIFIER(var_destination_catalog_name||'.`02_silver_tier_1_fusionu`.badges_vw') b
    LEFT JOIN IDENTIFIER(var_destination_catalog_name||'.`02_silver_tier_2`.fusionu_user_badges') ub on b.BadgeName = ub.badge_name
    LEFT JOIN IDENTIFIER(var_destination_catalog_name||'.`02_silver_tier_2`.fusion_employee') e on TRIM(e.EmployeeNbr) = TRIM(ub.EmployeeNbr)

    WHERE Audit_RowIsCurrent = TRUE
    AND (ub.Audit_ModifiedDateTime>=CAST(var_max_audit_time AS TIMESTAMP) 
        OR b.Load_Date_Time>CAST(var_max_audit_time AS TIMESTAMP)
        OR e.Audit_ModifiedDateTime>=CAST(var_max_audit_time AS TIMESTAMP) 
        )
  Type: Text
