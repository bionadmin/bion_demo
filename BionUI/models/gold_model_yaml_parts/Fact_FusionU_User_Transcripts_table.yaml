Name: Fact_FusionU_User_Transcripts
Settings:
- Name: Custom Beginning Cell
  Value: ""
  Type: Text
- Name: Custom Beginning Cell Enabled
  Value: |-
    Inherit
  Type: ThreeStateBoolean
- Name: Custom End Cell
  Value: ""
  Type: Text
- Name: Custom End Cell Enabled
  Value: |-
    Inherit
  Type: ThreeStateBoolean
- Name: Custom Pre Query Cell
  Value: ""
  Type: Text
- Name: Custom Pre Query Cell Enabled
  Value: |-
    Inherit
  Type: ThreeStateBoolean
- Name: Dest Change Data Feed Enabled
  Value: |-
    Inherit
  Type: ThreeStateBoolean
- Name: Dest PK Constraints Enabled
  Value: |-
    Inherit
  Type: ThreeStateBoolean
- Name: GoldTableQuery
  Value: |-
    , Employee AS
    (
        SELECT EmployeeUniqueId, Employee_Key, EmployeeId, EmployeeNbr, UserName, LastName, FirstName, LocationId, Audit_ModifiedDateTime
        FROM (
            SELECT EmployeeUniqueId, Employee_Key, EmployeeId, EmployeeNbr, UserName, LastName, FirstName, LocationId, Audit_ModifiedDateTime,
            row_number() OVER (PARTITION BY EmployeeNbr ORDER BY Audit_Source_ModifiedDateTime DESC) AS rn
            FROM IDENTIFIER(var_destination_catalog_name||'.02_silver_tier_2.Fusion_Employee')
            )
        WHERE rn = 1
    )

    SELECT DISTINCT 
        -- Fact Key
        utc.User_Transcript_Course_Key
        ,utc.user_course_id
        ,CAST(CONV(LEFT(HEX(utc.User_Transcript_Key), 15), 16, 10) AS BIGINT) AS Transcript_Id
        -- User Keys
        ,COALESCE(CAST(fe.EmployeeUniqueId AS STRING),'NULL') AS EmployeeUnique_Key 
        ,COALESCE(CAST(fe.EmployeeUniqueId AS STRING),'NULL') AS foreign_EmployeeUnique_Key_EmployeeUniqueId
        ,fe.EmployeeUniqueId
        ,fe.Employee_Key
        ,CAST(fe.EmployeeId AS STRING) AS foreign_Employee_Key_EmployeeId
        ,fe.EmployeeId
        ,utc.EmployeeNbr
        -- User Details (from users_vw)
        ,utc.user_key as fusionu_user_key
        ,fe.UserName
        ,CONCAT(FE.LastName, ', ', FE.FirstName) AS employee_name
        --User Location Details
        ,fl.Location_Key
        ,CAST(fl.LocationId AS STRING) AS foreign_Location_Key_LocationId
        ,fl.LocationId
        ,fl.Acronym as Location_Acronym
        ,fl.Name as Location_Name
        ,fl.BaseName as Location_BaseName
        ,fl.Division as Location_Division
        ,fl.Region as Location_Region
        ,fl.District as Location_District
        ,fl.State as Location_State
        -- Course Details 
        ,utc.course_id as Course_Key
        ,CAST(utc.course_id AS STRING) AS foreign_Course_Key_Course_Id
        ,utc.course_id
        ,utc.course_title
        ,utc.course_code
        ,utc.course_source
        ,utc.is_assigned
        ,utc.is_additional_course
        ,utc.is_supplemental
        ,utc.is_ilt
        ,utc.is_curriculum
        ,utc.curriculum_id as Curriculum_Key
        ,CAST(utc.curriculum_id AS STRING) AS foreign_Curriculum_Key_Curriculum_Id
        ,utc.curriculum_id
        ,utc.curriculum_name
        ,utc.curriculum_assignment
        ,fuc.curriculum_is_manual
        ,fuc.curriculum_is_optional
        ,utc.course_pack_id as course_pack_key
        ,CAST(utc.course_pack_id AS STRING) AS foreign_Course_Pack_Key_Course_Pack_Id
        ,utc.course_pack_id
        ,utc.course_pack_name
        ,utc.course_pack_is_locked
        ,utc.learning_path_order
        ,utc.learning_path_assignment
        -- Course Activity & Status
        ,utc.status
        ,utc.status_abbrev
        ,utc.assigned_date
        ,utc.last_activity_date
        ,utc.passed_date
        ,utc.due_date
        ,utc.compliance_date
        ,utc.locked_until_date
        ,utc.course_is_locked
        ,utc.is_autocompleted
        -- Scores & Duration
        ,utc.score_is_known
        ,utc.score
        ,utc.highest_score
        ,utc.duration_mins
        ,utc.attempt_limit
        ,utc.attempts
        ,utc.total_seconds as users_time_spent_seconds
        -- Course Counts (from transcript)
        ,utc.nonsupplemental_courses_assigned
        ,utc.nonsupplemental_courses_passed
        ,utc.supplemental_courses_assigned
        ,utc.supplemental_courses_passed
        ,utc.required_courses_assigned
        ,utc.required_courses_passed
        ,utc.nonrequired_courses_assigned
        ,utc.nonrequired_courses_passed
        ,utc.additional_courses_assigned
        ,utc.additional_courses_passed
        -- Required Course Boolean Flags (from fusionu_user_required_courses)
        ,urc.Is_Active_Shooter
        ,urc.Is_Boundaries
        ,urc.Is_Mandated_Reporter
        ,urc.Is_State_Required
        -- Audit Fields
        ,utc.CreatedDate
        ,utc.CreatedById
        ,utc.LastModifiedDate
        ,utc.LastModifiedById
        ,utc.Load_Date_Time
        ,utc.Audit_Source_ModifiedDateTime
        ,utc.Audit_CreatedDateTime
        ,utc.Audit_ModifiedDateTime
        ,current_timestamp() AS RIGHTNOW

    FROM IDENTIFIER(var_destination_catalog_name||'.`02_silver_tier_2`.fusionu_user_transcript_courses') utc 
    LEFT JOIN Employee FE
        ON TRIM(utc.EmployeeNbr) = TRIM(FE.EmployeeNbr)
    LEFT JOIN IDENTIFIER(var_destination_catalog_name||'.`02_silver_tier_2`.fusionu_user_required_courses') urc 
        ON utc.user_course_id = urc.user_course_id 
    LEFT JOIN IDENTIFIER(var_destination_catalog_name||'.`02_silver_tier_2`.Fusion_Location') fl
        ON  FE.LocationId = FL.LocationId
    LEFT JOIN IDENTIFIER(var_destination_catalog_name||'.`02_silver_tier_2`.fusionu_user_curriculums') fuc
        ON  utc.EmployeeNbr = fuc.EmployeeNbr
            AND utc.curriculum_id = fuc.curriculum_id

    WHERE utc.IsDeleted_Datalake = FALSE
          AND (
                utc.Audit_ModifiedDateTime > CAST(var_max_audit_time AS TIMESTAMP)
                OR urc.Audit_ModifiedDateTime > CAST(var_max_audit_time AS TIMESTAMP)
                OR urc.Audit_ModifiedDateTime > CAST(var_max_audit_time AS TIMESTAMP)
                OR fl.Audit_ModifiedDateTime > CAST(var_max_audit_time AS TIMESTAMP)
                OR fuc.Audit_ModifiedDateTime > CAST(var_max_audit_time AS TIMESTAMP)
            )
  Type: Text
