- Name: GoldTableQuery
  Value: |-
    SELECT
       APU.ApprovalGroupUser_Key AS SystemUniqueKey
      ,APU.ApprovalGroupUser_Key AS PayrollApprovalGroupUserId
      ,AG.ApprovalGroup_Key AS foreign_PayrollApprovalGroup_Key_PayrollApprovalGroupId
    ,COALESCE(CAST(fe.EmployeeUniqueId AS STRING),'NULL') AS EmployeeUnique_Key 
    ,COALESCE(CAST(fe.EmployeeUniqueId AS STRING),'NULL') AS foreign_EmployeeUnique_Key_EmployeeUniqueId
    ,fe.EmployeeUniqueId
      ,FE.Employee_Key
      ,FE.EmployeeId AS foreign_Employee_Key_EmployeeId
      ,APU.Role
      ,APU.CreatedBy AS CreatedById
         ,APU.Created AS CreatedDate
         ,APU.UpdatedBy AS LastModifiedById
         ,APU.LastUpdated AS LastModifiedDate
         ,CASE WHEN APU.IsDeleted_DataLake = TRUE OR FE.IsDeleted_DataLake = TRUE THEN TRUE ELSE FALSE END AS IsDeleted_DataLake
         ,6 AS SourceSystem_Key
         ,APU.Audit_ModifiedDateTime AS Audit_ModifiedDateTime
         ,current_timestamp() AS RIGHTNOW

      FROM IDENTIFIER(var_destination_catalog_name||'.02_silver_tier_1_matrix.ApprovalGroupUser_vw') APU
      INNER JOIN IDENTIFIER(var_destination_catalog_name||'.02_silver_tier_2.fusion_employee') FE
      ON TRIM(FE.Matrix_User_Key) = TRIM(APU.User_Key)
      INNER JOIN IDENTIFIER(var_destination_catalog_name||'.02_silver_tier_1_matrix.ApprovalGroup_vw') AG 
      ON AG.ApprovalGroup_Key = APU.ApprovalGroup_Key

        WHERE 
           (APU.Audit_ModifiedDateTime>CAST(var_max_audit_time AS TIMESTAMP)
           OR FE.Audit_ModifiedDateTime>CAST(var_max_audit_time AS TIMESTAMP)
           OR AG.Audit_ModifiedDateTime>CAST(var_max_audit_time AS TIMESTAMP)
           )
  Type: Text
- Name: InferMissingRecords
  Value: |-
    True
  Type: Boolean
- Name: UseHashKeys
  Value: |-
    True
  Type: Boolean
