- Name: GoldTableQuery
  Value: |-
    SELECT 
        PR.PayrollRun_Key AS SystemUniqueKey
       ,PR.PayrollRun_Key AS PayrollRunId
       ,PP.PayPeriod_Key AS foreign_PayPeriod_Key_PayPeriod_KeyId
    ,COALESCE(CAST(fe.EmployeeUniqueId AS STRING),'NULL') AS EmployeeUnique_Key 
    ,COALESCE(CAST(fe.EmployeeUniqueId AS STRING),'NULL') AS foreign_EmployeeUnique_Key_EmployeeUniqueId
      -- ,FE.Employee_Key
        ,FE.Matrix_User_Key
      -- ,FE.EmployeeId AS foreign_Employee_Key_EmployeeId
       ,FL.Location_Key
       ,FL.Matrix_Campus_Key
       ,FL.LocationId AS foreign_Location_Key_LocationId
       ,PR.RunDate
       ,PR.CreatedBy AS CreatedById
       ,PR.Created AS CreatedDate
       ,PR.UpdatedBy AS LastModifiedById
       ,PR.LastUpdated AS LastModifiedDate
       ,CASE WHEN PR.IsDeleted_DataLake = TRUE OR FE.IsDeleted_DataLake = TRUE THEN TRUE ELSE FALSE END AS IsDeleted_DataLake
       ,6 AS SourceSystem_Key
       ,PR.Audit_ModifiedDateTime AS Audit_ModifiedDateTime
       ,current_timestamp() AS RIGHTNOW
      FROM IDENTIFIER(var_destination_catalog_name||'.02_silver_tier_1_matrix.payrollrun_vw') PR
       INNER JOIN IDENTIFIER(var_destination_catalog_name||'.02_silver_tier_2.fusion_location') FL
       ON FL.Matrix_Campus_Key = PR.Campus_Key
       INNER JOIN IDENTIFIER(var_destination_catalog_name||'.02_silver_tier_2.fusion_employee') FE
       ON TRIM(FE.Matrix_User_Key) = TRIM(PR.User_Key)
       INNER JOIN IDENTIFIER(var_destination_catalog_name||".`02_silver_tier_1_matrix`.payperiod_vw") PP 
       ON PP.PayPeriod_Key = PR.PayPeriod_Key

      WHERE 
     PR.Audit_ModifiedDateTime>CAST(var_max_audit_time AS TIMESTAMP)
     OR FL.Audit_ModifiedDateTime>CAST(var_max_audit_time AS TIMESTAMP)
     OR FE.Audit_ModifiedDateTime>CAST(var_max_audit_time AS TIMESTAMP)
     OR PP.Audit_ModifiedDateTime>CAST(var_max_audit_time AS TIMESTAMP)
  Type: Text
- Name: InferMissingRecords
  Value: |-
    True
  Type: Boolean
- Name: UseHashKeys
  Value: |-
    True
  Type: Boolean
