- Name: GoldTableQuery
  Value: |
    SELECT 
           PTE.PayrollTimesheetEntry_Key AS PayrollTimesheetEntry_Key
          ,PTE.PayrollTimesheetEntry_Key AS PayrollTimesheetEntryId
          ,PTE.PayrollTimesheetEntry_Key AS SystemUniqueKey
          ,PT.Timesheet_Key
          ,PTE.PayPeriod_Key
          ,PTE.PayPeriod_Key AS foreign_PayPeriod_Key_PayPeriod_KeyId
          ,PTE.PayCode_Key
          ,PTE.PayCode_Key AS foreign_PayCode_Key_PayCodeId
          ,PT.PayrollRun_Key
          ,PT.PayrollRun_Key AS foreign_PayrollRun_Key_PayrollRunId
    ,COALESCE(CAST(fe.EmployeeUniqueId AS STRING),'NULL') AS EmployeeUnique_Key 
    ,COALESCE(CAST(fe.EmployeeUniqueId AS STRING),'NULL') AS foreign_EmployeeUnique_Key_EmployeeUniqueId
    ,fe.EmployeeUniqueId
          ,FL.Location_Key
          ,FL.LocationId AS foreign_Location_Key_LocationId
          ,PTE.ReservationInstance_Key
          ,RS.Title

          ,CASE 
            WHEN RI.SessionClassType_Key IS NOT NULL THEN TRUE 
            ELSE FALSE END AS ServiceAppointment

          ,PTE.RegularTime
          ,PTE.OverTime
          ,PTE.DoubleOverTime
          ,PTE.Rate
          ,PTE.RateOverride
          ,PTE.EffectiveDate
          ,PTE.TerminationDate
          ,CAST(from_utc_timestamp(PTE.EffectiveDate, COALESCE(FL.TimeZoneInfoIANAId, 'UTC')) AS TIMESTAMP) AS LocalStartTime
          ,CAST(from_utc_timestamp(PTE.TerminationDate, COALESCE(FL.TimeZoneInfoIANAId, 'UTC')) AS TIMESTAMP) AS LocalEndTime
          ,PTE.PayrollClientId
          ,PTE.PayrollDepartmentCode
          ,PTE.PayrollDepartmentCodeOverride
          ,PTE.StudentAbsentPlusSub
          ,PC.SessionCategory
          ,PTE.CreatedBy AS CreatedById
          ,PTE.Created AS CreatedDate
          ,PTE.UpdatedBy AS LastModifiedById
          ,PTE.LastUpdated AS LastModifiedDate
          ,PTE.IsDeleted_DataLake
          ,6 AS SourceSystem_Key
          ,FE.Matrix_User_Key
          ,FL.Matrix_Campus_Key
          ,PTE.Audit_ModifiedDateTime AS Audit_ModifiedDateTime
          ,current_timestamp() AS RIGHTNOW
        FROM IDENTIFIER(var_destination_catalog_name||'.02_silver_tier_1_matrix.PayrollTimesheetEntry_vw') PTE
        LEFT JOIN IDENTIFIER(var_destination_catalog_name||'.02_silver_tier_1_matrix.PayrollTimesheet_vw') PT
        ON PT.PayrollTimesheet_Key = PTE.PayrollTimesheet_Key
        LEFT JOIN IDENTIFIER(var_destination_catalog_name||'.02_silver_tier_1_matrix.ReservationInstance_vw') RI
        ON RI.ReservationInstance_Key = PTE.ReservationInstance_Key
        LEFT JOIN IDENTIFIER(var_destination_catalog_name||'.02_silver_tier_1_matrix.ReservationSeries_vw') RS 
        ON RS.ReservationSeries_Key = RI.ReservationSeries_Key
        LEFT JOIN IDENTIFIER(var_destination_catalog_name||'.02_silver_tier_2.fusion_paycode_buslogic_vw') PC
        ON PC.PayCode_Key = PTE.PayCode_Key
        INNER JOIN IDENTIFIER(var_destination_catalog_name||".02_silver_tier_2.fusion_location") FL
        ON FL.Matrix_Campus_Key = RI.Campus_Key
        INNER JOIN IDENTIFIER(var_destination_catalog_name||".02_silver_tier_2.fusion_employee") FE
        ON TRIM(FE.Matrix_User_Key) = TRIM(PTE.User_Key)

      WHERE 
       PTE.PayCode_Key IS NOT NULL
       AND FE.matrix_User_Key IS NOT NULL
       AND FE.IsDeleted_DataLake = FALSE
       AND (PTE.Audit_ModifiedDateTime>CAST(var_max_audit_time AS TIMESTAMP)
            OR PTE.Audit_ModifiedDateTime>CAST(var_max_audit_time AS TIMESTAMP)
            OR PTE.Audit_ModifiedDateTime>CAST(var_max_audit_time AS TIMESTAMP)
            OR PTE.Audit_ModifiedDateTime>CAST(var_max_audit_time AS TIMESTAMP)
            OR PTE.Audit_ModifiedDateTime>CAST(var_max_audit_time AS TIMESTAMP)
            OR PTE.Audit_ModifiedDateTime>CAST(var_max_audit_time AS TIMESTAMP)
            OR PTE.Audit_ModifiedDateTime>CAST(var_max_audit_time AS TIMESTAMP)
          )
  Type: Text
- Name: InferMissingRecords
  Value: |-
    True
  Type: Boolean
- Name: UseHashKeys
  Value: |-
    True
  Type: Boolean
