- Name: GoldTableQuery
  Value: |-
    SELECT
           QC.QualitativeCheckId AS Qualitative_Check_Key
          ,QC.QualitativeCheckId AS Qualitative_CheckId
          ,LOC.Id AS Location_Key
          ,LOC.Id AS foreign_Location_Key_LocationId
          ,QC.QualitativeCheckDate AS QualitativeCheckDate_Key
          ,QC.QualitativeCheckDate AS foreign_QualitativeCheckDate_Key_FullDate
          ,QC.ReportType
          ,QC.Score
          ,QC.ColorCodeLogic
          ,QC.CreatedDate
          ,QC.CreatedById
          ,QC.Audit_ModifiedDateTime
          ,QC.QualitativeCheckDate AS FilterDate
          ,current_timestamp() AS RIGHTNOW
        FROM IDENTIFIER(var_destination_catalog_name||'.02_silver_tier_2.fusion_qualitativecheck') QC
        LEFT JOIN IDENTIFIER(var_destination_catalog_name||'.02_silver_tier_1_salesforce.New_Schools__c_vw') LOC
        ON QC.Campus = LOC.base_name__c
            WHERE (QC.Audit_ModifiedDateTime>CAST(var_max_audit_time AS TIMESTAMP)
                  OR LOC.Audit_ModifiedDateTime>CAST(var_max_audit_time AS TIMESTAMP)
                  )
  Type: Text
