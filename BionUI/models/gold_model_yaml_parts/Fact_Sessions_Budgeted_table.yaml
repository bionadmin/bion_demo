- Name: GoldTableQuery
  Value: |-
    SELECT 
     Session_Key AS Sessions_Budgeted_Key,
     CAST(SessionId AS STRING) AS SessionId_Key,
     COALESCE(CAST(SessionId AS STRING), '-1') AS Session_Key,
     --CAST(SessionId AS STRING) AS foreign_Session_Key_SessionId,
     IsServiceAppointment,
     date_trunc('minute', LocalStartTime) as LocalStartTime,
     date_trunc('minute', LocalEndTime) as LocalEndTime,
     TaughtTime,
     TotalTime,
     IsStatused,
     FirstScheduled,
     SessionRate,
     SessionNumber,
     IsBillable,
     COALESCE(CAST(StudentContactId  AS STRING),'-1') AS Student_Key, 
     COALESCE(CAST(StudentContactId  AS STRING),'-1') AS foreign_Student_Key_ContactId,
     ClientName,
     StudentId,
     StudentContactId,  
     ServiceName,
     ProductCode,
     CASE 
        WHEN UPPER(SessionStatus) = 'ACTIVE' AND CAST(LocalStartTime AS DATE) > CAST(current_timestamp() AS DATE) 
            THEN 'FUTURE'
        ELSE SessionStatusDisplayName
        END AS SessionStatusDisplayName,
     SessionStatus,
     StaffName,
     COALESCE(CAST(EmployeeUniqueId AS STRING),'NULL') AS EmployeeUnique_Key, 
    COALESCE(CAST(EmployeeUniqueId AS STRING),'NULL') AS foreign_EmployeeUnique_Key_EmployeeUniqueId,
     CAST(EmployeeUniqueId AS STRING),
     TeacherId as EmployeeId,
     PayCode,
     PayCodeDisplayType,
     COALESCE(CAST(AppointmentLocationId AS STRING),'-1') AS AppointmentLocation_Key,
     COALESCE(CAST(AppointmentLocationId AS STRING),'-1') AS foreign_AppointmentLocation_Key_LocationId,
     AppointmentLocation,
     AppointmentLocationId,
     IsVirtualSession,
     Division,
     IsAdditionalAppt,
     DifficultyLevel,
     SfOpportunityLineItemId,
     COALESCE(CAST(ClassId AS STRING), '-1') AS Class_Key,
     COALESCE(CAST(ClassId AS STRING), '-1') AS foreign_Class_Key_ClassId,
     ClassId,
     Company_Key,
     SystemUniqueKey,
     Modality,
     IsDiscretionaryBudget,
     SessionCategory,
     ClassSecondaryName,
     MatrixStatus,
     Product_Key,
     CAST(IFNULL(Product_Key,'NULL') AS STRING) AS foreign_Product_Key_ProductId,
     StudentType,
     SourceSystem_Key,
     IsDeleted_DataLake,
     CreatedDate,
     CreatedById,
     LastModifiedDate,
     LastModifiedById,
     Audit_ModifiedDateTime,
     CAST(LocalStartTime AS DATE) FilterDate,
     current_timestamp() AS RIGHTNOW
    FROM IDENTIFIER(var_destination_catalog_name||".`02_silver_tier_2`.fusion_sessions_budgeted_student_type_weekly")
    WHERE IsBudgeted = TRUE
