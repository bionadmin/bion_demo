- Name: GoldTableQuery
  Value: |-
    SELECT
        CAST(s.Session_Key_Int AS STRING) as Sessions_Filtered_ModalityId
        ,s.Session_Key AS Sessions_Filtered_Modality_Key
        ,s.Session_Key
        ,COALESCE(s.IsServiceAppointment, FALSE) AS IsServiceAppointment
        ,s.LocalStartTime
        ,s.LocalEndTime
        ,CASE WHEN LOWER(l.Division) = 'futures' THEN 1.0 ELSE s.TaughtTime END AS TaughtTime
        ,CASE WHEN LOWER(l.Division) = 'futures' THEN 1.0 ELSE s.TotalTime END AS TotalTime
        ,s.IsStatused
        ,s.FirstScheduled
        ,s.SessionRate
        ,s.SessionNumber
        ,s.IsBillable
        ,COALESCE(CAST(st.ContactId AS STRING),'NULL') AS Student_Key
        ,COALESCE(CAST(st.ContactId AS STRING),'NULL') AS foreign_Student_Key_ContactId
        ,CONCAT(st.LastName, ',', st.FirstName) AS ClientName
        ,st.StudentId
        ,p.Name AS ServiceName
        ,COALESCE(p.ProductCode, '-1') AS ProductCode
        ,s.ClassSessionStatus AS SessionStatusDisplayName
        ,CASE
            WHEN s.Matrix_ClassSessionStatus_key NOT IN ('2', '3', '5', '7') THEN 'ACTIVE'
            WHEN UPPER(p.ProductCode) = 'FASYNCSESSION' AND s.StudentAttendance = 2 THEN 'ACTIVE'
            ELSE s.SessionStatus
        END AS SessionStatus
        ,CONCAT(e.LastName, ',', e.FirstName) AS StaffName
        ,COALESCE(CAST(s.EmployeeUniqueId AS STRING),'NULL') AS EmployeeUnique_Key
        ,COALESCE(CAST(s.EmployeeUniqueId AS STRING),'NULL') AS foreign_EmployeeUnique_Key_EmployeeUniqueId
        ,pc.Description AS PayCode
        ,pc.PayCodeDisplayType
        ,COALESCE(CAST(l.LocationId AS STRING),'NULL') AS AppointmentLocation_Key
        ,COALESCE(CAST(l.LocationId AS STRING),'NULL') AS foreign_AppointmentLocation_Key_LocationId
        ,l.Name AS AppointmentLocation
        ,s.IsVirtualSession
        ,l.Division
        ,s.IsCoaching
        ,s.IsAdditionalAppt
        ,s.DifficultyLevelDisplayName AS DifficultyLevel
        ,s.ClassSourcesystem_key AS SfOpportunityLineItemId
        ,COALESCE(CAST(s.ClassId AS STRING), '-1') AS Class_Key
        ,COALESCE(CAST(fc.ClassId AS STRING), '-1') AS foreign_Class_Key_ClassId
        ,s.Company_Key
        ,s.SystemUniquekey AS SystemUniqueKey
        ,s.Modality
        ,CASE
            WHEN pc.IsDiscretionaryBudget = TRUE AND s.IsServiceAppointment <> TRUE THEN TRUE
            ELSE FALSE
        END AS IsDiscretionaryBudget
        ,COALESCE(s.SessionCategory, 'Unknown') AS SessionCategory
        ,fc.ClassSecondaryName
        ,s.MatrixStatus
        ,s.Product_Key
        ,CAST(IFNULL(s.Product_Key,'NULL') AS STRING) AS foreign_Product_Key_ProductId
        ,COALESCE(stdtype.StudentType_4, 'CFC') AS StudentType
        ,'FusionSalesforce' AS SourceSystem
        ,s.SourceSystem_Key as SourceSystem_Key
        ,s.CreatedDate
        ,s.CreatedById
        ,s.LastModifiedDate
        ,s.LastModifiedById
        --if the session, student, or studenttypeweekly have a status of TRUE, then TRUE
        ,CASE WHEN s.IsDeleted_DataLake = TRUE OR st.IsDeleted_DataLake = TRUE OR stdtype.IsDeleted_DataLake = TRUE THEN TRUE 
            ELSE FALSE 
            END AS IsDeleted_DataLake
        ,s.Audit_ModifiedDateTime
        ,current_timestamp() AS RIGHTNOW
        ,NULL AS FilterDate



    FROM IDENTIFIER(var_destination_catalog_name||".`02_silver_tier_2`.fusion_sessions") s
        LEFT JOIN IDENTIFIER(var_destination_catalog_name||".`02_silver_tier_2`.fusion_student") st
            ON st.Student_Key = s.Student_Key
        LEFT JOIN IDENTIFIER(var_destination_catalog_name||".`02_silver_tier_1_salesforce`.product2_vw") p
            ON p.Id = s.ProductId
        LEFT JOIN IDENTIFIER(var_destination_catalog_name||".`02_silver_tier_2`.fusion_employee") e
            ON e.EmployeeUniqueId = s.EmployeeUniqueId 
        LEFT JOIN IDENTIFIER(var_destination_catalog_name||".`02_silver_tier_2`.fusion_paycode_buslogic_vw") pc
            ON pc.PayCode_Key = s.PayCode_Key
        LEFT JOIN IDENTIFIER(var_destination_catalog_name||".`02_silver_tier_2`.fusion_location") l
            ON l.Location_Key = s.ScheduleLocation_Key
        LEFT JOIN IDENTIFIER(var_destination_catalog_name||".`02_silver_tier_2`.fusion_class") fc
            ON fc.ClassId = s.ClassId
        LEFT JOIN IDENTIFIER(var_destination_catalog_name||".`02_silver_tier_2`.fusion_date") dd
            ON dd.FullDate = CAST(s.LocalStartTime AS DATE)
        LEFT JOIN IDENTIFIER(var_destination_catalog_name||".`02_silver_tier_2`.fusion_dm_studenttypeweekly") stdtype
            ON stdtype.Student_Key = st.Student_Key
            AND stdtype.Location_Key = l.Location_Key
            AND stdtype.SessionYear = dd.CalendarYear
            AND stdtype.TheWeek = dd.CalendarWeek
            AND stdtype.TheFirstOfWeek = dd.FirstDateOfWeek

    WHERE s.IsCloseoutSession = FALSE
      AND s.IsAssessment = FALSE
      AND s.IsBudgeted = TRUE
      AND (s.Audit_ModifiedDateTime>CAST(var_max_audit_time AS TIMESTAMP)
            OR st.Audit_ModifiedDateTime>CAST(var_max_audit_time AS TIMESTAMP)
            OR p.Audit_ModifiedDateTime>CAST(var_max_audit_time AS TIMESTAMP)
            OR e.Audit_ModifiedDateTime>CAST(var_max_audit_time AS TIMESTAMP)
            OR pc.Audit_ModifiedDateTime>CAST(var_max_audit_time AS TIMESTAMP)
            OR l.Audit_ModifiedDateTime>CAST(var_max_audit_time AS TIMESTAMP)
            OR fc.Audit_ModifiedDateTime>CAST(var_max_audit_time AS TIMESTAMP)
            OR stdtype.Audit_ModifiedDateTime>CAST(var_max_audit_time AS TIMESTAMP)
      )
  Type: Text
