- Name: GoldTableQuery
  Value: |-
    SELECT 
       Session_Key
       ,CAST(Session_Key_Int AS STRING) AS SessionId_Key
       ,COALESCE(CAST(SystemUniqueKey AS STRING), '-1') AS SystemUniqueKey
       ,COALESCE(CAST(SystemUniqueKey AS STRING), '-1') AS foreign_Class_Key_SystemUniqueKey
       ,COALESCE(CAST(ClassId AS STRING), '-1') AS Class_Key
       ,COALESCE(CAST(ClassId AS STRING), '-1') AS foreign_Class_Key_ClassId
       ,ClassId
       ,Product_Key 
       ,Product_Key as ProductId
       ,CAST(IFNULL(Product_Key,'NULL') AS STRING) AS foreign_Product_Key_ProductId
       ,SessionDate_Key
       ,COALESCE(CAST(EmployeeUniqueId AS STRING),'NULL') AS EmployeeUnique_Key 
       ,COALESCE(CAST(EmployeeUniqueId AS STRING),'NULL') AS foreign_EmployeeUnique_Key_EmployeeUniqueId
       ,COALESCE(CAST(StudentContactId AS STRING),'NULL') AS Student_Key 
       ,COALESCE(CAST(StudentContactId AS STRING),'NULL') AS foreign_Student_Key_ContactId   
       ,COALESCE(CAST(ScheduleLocationId AS STRING),'NULL' ) AS ScheduleLocation_Key 
       ,COALESCE(CAST(ScheduleLocationId AS STRING),'NULL') AS foreign_ScheduleLocation_Key_LocationId     
       ,COALESCE(CAST(StudentLocationId AS STRING),'NULL' ) AS StudentLocation_Key 
       ,COALESCE(CAST(StudentLocationId AS STRING),'NULL') AS foreign_StudentLocation_Key_LocationId    
       ,COALESCE(CAST(TeacherLocationId AS STRING),'NULL') AS EmployeeLocation_Key 
       ,COALESCE(CAST(TeacherLocationId AS STRING),'NULL') AS foreign_EmployeeLocation_Key_LocationId   
       ,DeliveryMethod_Key
       ,DifficultyLevelDisplayName
       ,PayCode_Key
       ,PayCode_Key as PayCodeId 
       ,CAST(IFNULL(PayCode_Key,'NULL') AS STRING) AS foreign_PayCode_Key_PayCodeId   
       ,TeacherAttendance
       ,StudentAttendance
       ,IsCloseoutSession
       ,IsAssessment
       ,TaughtTime
       ,TotalTime
       ,IsBillable
       ,IsStatused
       ,ClientTypeAtTimeOfSession
       ,SessionRate
       ,IsEmployeeActive
       ,IsGroupClass
       ,IsServiceAppointment
       ,IsOffPeak
       ,IsWeeklyTotalCappedByPromo
       ,IsFlexAsync
       ,IsCoaching
       ,IsGroup
       ,IsVirtualSession AS IsVirtual
       ,SessionType
       ,IsDiscretionary 
       ,IsDeleted_Datalake
       ,StartTime
       ,EndTime
       ,FirstScheduled
       ,LocalStartTime
       ,LocalEndTime
       ,CreatedDate 
       ,CreatedById
       ,LastModifiedDate
       ,LastModifiedById
       ,NULL AS FilterDate
       ,Reservation_Student_Key
       ,Audit_ModifiedDateTime 
       ,current_timestamp() AS RIGHTNOW
       ,StudentLocationId 
       ,StudentId  
       ,StudentContactId
       ,StudentPrimaryLocation 
       ,CAST(EmployeeUniqueId AS STRING)
       ,TeacherId AS EmployeeId
       ,TeacherNbr AS EmployeeNbr
       ,TeacherLocationId  AS EmployeeLocationId
       ,ScheduleLocationId
       ,IsDiscretionaryBudget
       ,IsAdditionalAppt 
       ,ClassSecondaryName
       ,Title
       ,SourceSystem_Key
       ,ClassSourceSystem_Key
       ,MatrixStatus
       ,Matrix_ClassSessionStatus_key
       ,SessionCategory
       ,SessionNumber
       ,Modality
       ,SessionStatus
    FROM IDENTIFIER(var_destination_catalog_name||".`02_silver_tier_2`.fusion_sessions")
    WHERE  (Audit_ModifiedDateTime>CAST(var_max_audit_time AS TIMESTAMP))
