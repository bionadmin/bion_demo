  Type: ThreeStateBoolean
- Name: GoldTableQuery
  Value: |
    SELECT 
        ds.ContactId AS foreign_Student_Key_ContactId,
        swt.Student_Key AS Student_PK_Key,
        fl.locationId AS foreign_Location_Key_LocationId,
        swt.Location_Key AS Location_PK_Key,
        swt.StudentSemesterStatus,
        swt.Class_Count,
        swt.TM_Count,
        swt.CM_Count,
        swt.SessionYear,
        swt.TheWeek AS CalendarWeek,
        swt.YYYYWW,
        swt.TheFirstOfWeek AS FirstDateOfWeek,
        swt.StudentType_4 AS StudentType_Abbreviation,
        CASE WHEN ds.IsDeleted_DataLake = TRUE
            OR swt.IsDeleted_DataLake = TRUE
            THEN TRUE
            ELSE FALSE END AS IsDeleted_DataLake,
        current_timestamp() AS Audit_ModifiedDateTime,   
        current_timestamp() AS RIGHTNOW--leave this.
    FROM IDENTIFIER(var_destination_catalog_name||'.02_silver_tier_2.fusion_dm_studenttypeweekly') swt
    INNER JOIN IDENTIFIER(var_destination_catalog_name||'.02_silver_tier_2.fusion_student') ds
        ON swt.StudentId = ds.StudentId
    INNER JOIN IDENTIFIER(var_destination_catalog_name||'.02_silver_tier_2.fusion_location ') fl
        ON fl.Location_key = swt.Location_Key
  Type: Text
- Name: IncludeInWorkflow
  Value: |-
    False
  Type: Boolean
- Name: InferMissingRecords
  Value: |-
    True
  Type: Boolean
- Name: UseHashKeys
  Value: |-
    True
  Type: Boolean
