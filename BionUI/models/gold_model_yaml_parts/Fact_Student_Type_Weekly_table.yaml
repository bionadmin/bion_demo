- Name: Custom Pre Query Cell
  Value: |-
    %sql
    -- onprem truncates table every time
    TRUNCATE TABLE IDENTIFIER(var_destination_catalog_name||'.03_gold_operational'||'.Fact_Student_Type_Weekly')
  Type: Text
