- Name: GoldTableQuery
  Value: |
    SELECT
           TE.TimesheetEntry_Key AS SystemUniqueKey
          ,TE.TimesheetEntry_Key AS TimesheetEntryId
          ,T.Timesheet_Key
          ,T.PayPeriod_Key
          ,T.PayPeriod_Key AS foreign_PayPeriod_Key_PayPeriod_KeyId
          ,TE.PayCode_Key   
          ,TE.PayCode_Key AS foreign_PayCode_Key_PayCodeId
          ,FE.EmployeeUniqueId
    ,COALESCE(CAST(FE.EmployeeUniqueId AS STRING),'NULL') AS EmployeeUnique_Key 
    ,COALESCE(CAST(FE.EmployeeUniqueId AS STRING),'NULL') AS foreign_EmployeeUnique_Key_EmployeeUniqueId
          ,DL.LocationId
          ,DL.LocationId AS foreign_Location_Key_LocationId
          ,TE.ReservationInstance_Key
          ,RS.Title
          ,CASE 
           WHEN RI.SessionClassType_Key IS NOT NULL THEN true 
           ELSE false END AS IsServiceAppointment
          ,TE.IsApproved
          ,TE.ApprovalDate
          ,TE.IsLocked
          ,TE.LockedDate
          ,TE.LockedBy
          ,TE.Hours
          ,TE.MealBreaksAcknowledged
          ,TE.CorrectnessAcknowledged
          ,TE.EffectiveDate
          ,TE.TerminationDate
          ,CAST(from_utc_timestamp(TE.EffectiveDate, COALESCE(DL.TimeZoneInfoIANAId, 'UTC')) AS TIMESTAMP) AS LocalStartTime
          ,CAST(from_utc_timestamp(TE.TerminationDate, COALESCE(DL.TimeZoneInfoIANAId, 'UTC')) AS TIMESTAMP) AS LocalEndTime
          ,T.IsFlagged
          ,T.IsProcessed
          ,T.UsedPtoBalanceHours
          ,PC.SessionCategory
          ,TE.CreatedBy AS CreatedById
          ,TE.Created AS CreatedDate
          ,TE.UpdatedBy AS LastModifiedById
          ,TE.LastUpdated AS LastModifiedDate
          ,TE.IsDeleted_DataLake
          ,6 AS SourceSystem_Key
          ,FE.Matrix_User_Key
          ,DL.Matrix_Campus_Key
          ,TE.Audit_ModifiedDateTime AS Audit_ModifiedDateTime
          ,current_timestamp() AS RIGHTNOW
        FROM IDENTIFIER(var_destination_catalog_name||'.02_silver_tier_1_matrix.TimesheetEntry_vw') TE
       LEFT JOIN IDENTIFIER(var_destination_catalog_name||'.02_silver_tier_1_matrix.Timesheet_vw') T
       ON t.Timesheet_Key = te.Timesheet_Key
       LEFT JOIN IDENTIFIER(var_destination_catalog_name||'.02_silver_tier_1_matrix.ReservationInstance_vw') RI
       ON ri.ReservationInstance_Key = te.ReservationInstance_Key
       LEFT JOIN IDENTIFIER(var_destination_catalog_name||'.02_silver_tier_1_matrix.ReservationSeries_vw') RS 
       ON rs.ReservationSeries_Key = ri.ReservationSeries_Key
       LEFT JOIN IDENTIFIER(var_destination_catalog_name||'.02_silver_tier_2.fusion_paycode_buslogic_vw') PC
       ON PC.PayCode_Key = TE.PayCode_Key
       INNER JOIN IDENTIFIER(var_destination_catalog_name||".02_silver_tier_2.fusion_location") DL
       ON DL.Matrix_Campus_Key = RI.Campus_Key
       INNER JOIN IDENTIFIER(var_destination_catalog_name||".02_silver_tier_2.fusion_employee") FE
       ON TRIM(FE.Matrix_User_Key) = TRIM(TE.User_Key)

      WHERE 
       TE.PayCode_Key IS NOT NULL
       AND FE.matrix_User_Key IS NOT NULL
       AND FE.IsDeleted_DataLake = FALSE
       AND (TE.Audit_ModifiedDateTime>CAST(var_max_audit_time AS TIMESTAMP)
            OR T.Audit_ModifiedDateTime>CAST(var_max_audit_time AS TIMESTAMP)
            OR RI.Audit_ModifiedDateTime>CAST(var_max_audit_time AS TIMESTAMP)
            OR RS.Audit_ModifiedDateTime>CAST(var_max_audit_time AS TIMESTAMP)
            OR PC.Audit_ModifiedDateTime>CAST(var_max_audit_time AS TIMESTAMP)
            OR DL.Audit_ModifiedDateTime>CAST(var_max_audit_time AS TIMESTAMP)
            OR FE.Audit_ModifiedDateTime>CAST(var_max_audit_time AS TIMESTAMP)
          )
  Type: Text
- Name: InferMissingRecords
  Value: |-
    True
  Type: Boolean
- Name: UpdateSourceSystemField
